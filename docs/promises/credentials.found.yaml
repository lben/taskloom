# The bugs proving credentials on the PC found, each fixed and guarded by a test since (the proof PDF counts and lists
# them before the details; tests/test_promises_found.py checks each test exists), and where it is checked more lightly.
found:
  - what: 'After a card was renamed with "also rewrite the open flows" (CR-16), a message that starts with the card''s name or with secret:CARD.key, such as Inspect''s "UAT.password is shown as {{secret:UAT.password}}", was taken as one whole reference, so the {{secret:...}} in it still named the old card.'
    found_by: the mutation test writer
    fixed_in: 6360ebf
    guarded_by: tests/test_credentials_flows_more.py::test_the_rewrite_renames_the_reference_in_a_message_that_starts_with_the_cards_name
  - what: 'In the Credentials window, after a card above others was deleted, the rows shown were another card''s, not those of the card the list then had chosen (CR-1).'
    found_by: the mutation test writer
    fixed_in: 0cc7132
    guarded_by: tests/test_credentials_window_actions.py::test_after_a_card_above_others_is_deleted_the_rows_shown_are_those_of_the_card_chosen
  - what: 'A value of several lines, such as a key, that a run''s code printed in a run started as the editor starts it (unbuffered) could show its lines in the Log and the terminal: what was written was hidden up to its last line break, which can fall inside the value (CR-5).'
    found_by: the reviewer
    fixed_in: ca56547
    guarded_by: tests/test_credentials_review.py::test_a_value_of_several_lines_printed_many_times_shows_only_as_stars
  - what: 'Validate warned about a secret put onto a server''s command line only in a command, not in Start Remote Process''s folder, log file, PID file or check after, Stop Remote Process''s and Health Check''s PID file, or Remote Extract''s archive and destination (CR-19).'
    found_by: the reviewer
    fixed_in: ca56547
    guarded_by: tests/test_credentials_review.py::test_validate_warns_for_a_secret_in_every_setting_that_goes_onto_a_servers_command_line
  - what: 'Where the output''s coding lacks one of a value''s letters (cp1252 and ż), a value of several lines written in parts with flushes showed, with that letter as Python writes it there (ż) (CR-5).'
    found_by: the test writer
    fixed_in: 4873332
    guarded_by: tests/test_credentials_ready.py::test_a_value_of_several_lines_with_a_letter_the_output_has_not_written_in_parts_shows_only_as_stars
  - what: 'What a scheduled run wrote to its error output just before it crashed was missing from the failure notice and email, as the thread that hid the values ended with the run; the values are now hidden by a process of its own (CR-5).'
    found_by: CI on Linux
    fixed_in: 743f012
    guarded_by: tests/test_credentials_sinks.py::test_a_scheduled_run_that_crashes_after_writing_the_value_is_told_and_emailed_with_stars
lighter:
  - "The real macOS Keychain is not tried, and the real Windows Credential Manager only on CI; every other test uses a stand-in store, and a real store that fails is not tried."
  - "What a program a block starts prints after the run has ended may be lost, and Windows' console may show other alphabets garbled: neither is checked on Windows' console."
  - "A value is hidden only once the process has read it: one typed by hand that equals a stored secret is not; a value of fewer than 4 characters is not hidden (CR-6)."
  - "Chains of cards and of pointers are tried two long; longer ones are not."
  - "The hidden prompt of taskloom secret set is tried without a terminal of its own, not in a real terminal."
