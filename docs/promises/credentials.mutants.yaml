# Mutation testing of credentials on the PC (read by packaging/mutants.py --explained). scope: what the bugs are
# planted in, the functions the stage touched (2e5a93e: the store, the list file, the resolver and taskloom secret;
# 539441f: references in texts, Python Code and Validate; 0b36da9 and 0ba3b91: hiding what a run tells; 7fe3ed3: the
# Credentials window; cf49097: the Connections window's credential list, the store's errors in the editor), in groups:
# each group's bugs run the tests that can see them (each line of tests: is one pytest run, a file or several, with -k
# words or without). taskloom/credentials.py and taskloom/editor/credentials_window.py are new and tested whole, as
# are the other functions that are new or mostly rewritten. A function in which the stage touched a few lines, among
# much that was there before, is under not_tested: its bugs are planted and counted, not run, and its reason names the
# tests that run the lines changed (none of these was checked by taking the lines out by hand). Nothing is planted in
# credentials._asking_the_store, as mutmut plants nothing in a function with a decorator other than staticmethod or
# classmethod (it is a contextlib.contextmanager): the tests of a store that cannot be used
# (test_on_a_pc_a_store_that_cannot_be_used_is_said_and_nothing_is_stored_or_read_from_a_file,
# test_a_store_that_cannot_be_used_on_save_is_said_and_nothing_is_stored) check it. Nor in Block.references, which
# only returns [], nor in ConnectionsDialog._save (`if self._write(): self.accept()`), in which mutmut finds nothing to
# change. The stage's other lines changed only a docstring (params.parse, Home.resolve_secrets) or are not functions
# (imports, constants, the blocks' examples and help). The mutants the tests let through are explained here, by kind
# (kinds: a kind, its why, the mutants it explains) or one by one (mutant name: why it changes nothing a user could
# notice). Only those no user could notice are explained: the others stay without a reason until a test catches
# them.
# parts: the CI jobs its mutants run in at once, each job every Nth mutant (packaging/mutants.py --part K/N),
# the parts scored as one run in one job. It has not run whole yet: 4 is set from its size, about 2,600 mutants, 1,100
# of them in the window, whose tests go through the editor; to be set again from the first full run's minutes.
parts: 4
scope:
  mutate:
    - mutate:
        - taskloom/credentials.py
        - taskloom/cli.py cmd_secret_set
        - taskloom/cli.py cmd_secret_delete
        - taskloom/cli.py cmd_secret_list
        - taskloom/config.py Home.get_secret
        - taskloom/config.py Home.set_secret
      tests:
        - tests/test_credentials_store.py
        - tests/test_credentials_window.py -k "save_stores or no_value_stored or stored_value_not_listed or two_windows or store_that or deleting or long_value_pasted or circle_is_refused or renaming_a_card_or_key_follows or other_case"
        - tests/test_credentials_refs.py -k "circle_reached or other_case or validate_names_every_missing or run_stops_before"
    - mutate:
        - taskloom/cli.py cmd_run
        - taskloom/cli.py _hide_below_print
        - taskloom/cli.py _Relay.__init__
        - taskloom/cli.py _Relay.flushed
        - taskloom/cli.py _Relay.run
        - taskloom/cli.py _Relay._put
        - taskloom/cli.py _Hiding.__init__
        - taskloom/cli.py _Hiding.write
        - taskloom/cli.py _Hiding.flush
        - taskloom/cli.py _Hiding.__getattr__
      tests:
        - tests/test_credentials_gaps.py -k "below_print or start_remote_process"
        - tests/test_credentials_sinks.py -k "what_a_block_prints or library_writes_straight or error_line_of_taskloom_run or scheduled_run_that"
        - tests/test_credentials_refs.py -k "values_of_any_content or ssh_command_reaches"
    - mutate:
        - taskloom/engine.py forms_of
        - taskloom/engine.py secret_forms
        - taskloom/engine.py _scrub_tables
        - taskloom/pyenv.py masked
      tests:
        - tests/test_credentials_sinks.py
        - tests/test_credentials_refs.py -k "values_of_any_content or python_code_gets_a_value"
        - tests/test_credentials_editor.py -k "log_pane or data_preview or copy_executed_query"
    - mutate:
        - taskloom/params.py reference
        - taskloom/params.py references
        - taskloom/params.py render
        - taskloom/params.py template_names
        - taskloom/flow.py _texts
        - taskloom/flow.py _references
        - taskloom/flow.py _secret_refs
        - taskloom/blocks/logic.py _secret_calls
        - taskloom/blocks/logic.py PythonCode.problems
        - taskloom/blocks/logic.py PythonCode.references
        - taskloom/blocks/logic.py ReusableBlock.problems
        - taskloom/blocks/logic.py ReusableBlock.references
        - taskloom/blocks/logic.py AskUser.references
        - taskloom/blocks/logic.py Inspect.references
        - taskloom/blocks/reports.py HtmlTemplate.references
        - taskloom/blocks/servers.py ApiRequest.references
      tests:
        - tests/test_credentials_refs.py
        - tests/test_placeholders.py
        - tests/test_credentials_gaps.py -k validate_names_a_missing_card
        - tests/test_credentials_sinks.py -k connection_names_a_missing_card
    - mutate:
        - taskloom/params.py renamed
        - taskloom/flow.py renamed_credentials
        - taskloom/flow.py _renamed
      tests:
        - tests/test_credentials_window.py -k "open_flows or rewrite"
    - mutate:
        - taskloom/editor/credentials_window.py
        - taskloom/editor/window.py MainWindow.edit_credentials
      tests:
        - tests/test_credentials_window.py
        - tests/test_credentials_editor.py -k "save_clicked or switching_what_a_card"
    - mutate:
        - taskloom/editor/dialogs.py ConnectionsDialog._set_password_ref
        - taskloom/editor/dialogs.py ConnectionsDialog._credential_chosen
        - taskloom/editor/dialogs.py ConnectionsDialog._show_password_status
        - taskloom/editor/dialogs.py ConnectionsDialog._write
      tests:
        - tests/test_credentials_editor.py -k "connections or fill_in"
        - tests/test_api_request.py -k made_in_the_connections_window
    - mutate:
        - taskloom/cli.py _cmd_run
        - taskloom/cli.py main
        - taskloom/cli.py run_cli
        - taskloom/engine.py run_flow
        - taskloom/engine.py _Runner._run_loop
        - taskloom/engine.py _Runner._run_per_line
        - taskloom/engine.py _Runner._gather
        - taskloom/engine.py _Runner._keep_outputs
        - taskloom/engine.py _Runner._run_block
        - taskloom/engine.py _filled
        - taskloom/engine.py _fill
        - taskloom/engine.py _typed
        - taskloom/engine.py _only_inputs
        - taskloom/flow.py validate
        - taskloom/pyenv.py run_code
        - taskloom/scheduler.py Scheduler.__init__
        - taskloom/blocks/logic.py PythonCode.run
        - taskloom/blocks/logic.py PythonCode._run_here
        - taskloom/blocks/logic.py _message_source
        - taskloom/blocks/reports.py HtmlTemplate.problems
        - taskloom/blocks/reports.py HtmlTemplate.run
        - taskloom/blocks/servers.py from_curl
        - taskloom/editor/dialogs.py ConnectionsDialog.__init__
        - taskloom/editor/dialogs.py ConnectionsDialog._show_kind
        - taskloom/editor/dialogs.py ConnectionsDialog._test
        - taskloom/editor/panels.py PropertiesPanel._fill_from_curl
        - taskloom/editor/panels.py PropertiesPanel._secret_name
        - taskloom/editor/safety.py Safety.install_crash_log
        - taskloom/editor/window.py MainWindow._make_actions
        - taskloom/editor/window.py MainWindow.copy_as_curl
      tests:
        - tests/test_credentials_refs.py -k braces_inside_a_value_are_never_filled
not_tested:
  taskloom/cli.py _cmd_run: >-
    A run from the command line, about seventy lines, of which the stage changed only its name: cmd_run (tested whole)
    now wraps it in the hiding of what code below print writes.
  taskloom/cli.py main: >-
    The command line's parser, about a hundred and ten lines, to which the stage added taskloom secret's set, list and
    delete and exit code 1 for a CredentialError: the tests of tests/test_credentials_store.py run each of them.
  taskloom/cli.py run_cli: >-
    The start of every command, in which one line now puts _Hiding (tested whole) over sys.stdout and sys.stderr:
    test_what_a_block_prints_outputs_and_fails_with_shows_as_stars_and_no_file_holds_it and the below_print tests of
    tests/test_credentials_gaps.py run it.
  taskloom/engine.py run_flow: >-
    The whole of a run, in which the stage changed two calls: Validate with values=True before the first block, and
    the parameters recorded as redact gives them. test_a_run_stops_before_its_first_block_naming_every_missing_card_key_and_stored_value
    and test_a_value_given_as_a_parameter_shows_as_stars_in_run_history_the_database_and_the_email run them.
  taskloom/engine.py _Runner._run_loop: >-
    A Loop's run, about a hundred lines, in which the stage only gives _filled Home.get_secret for {{secret:}}; no
    test fills a reference inside a Loop.
  taskloom/engine.py _Runner._run_per_line: >-
    A block run for each line of a Splitter, about a hundred and fifty lines, in which the stage only gives _filled
    Home.get_secret; no test fills a reference on a Splitter's lines.
  taskloom/engine.py _Runner._gather: >-
    A block's inputs in a full run, about sixty lines, in which the stage only gives the typed values Home.get_secret;
    no test fills a reference in a typed value.
  taskloom/engine.py _Runner._keep_outputs: >-
    The outputs kept for a later re-run, about thirty lines, to which the stage added seven: an output or a typed text
    holding a value read (in any form engine.forms_of gives) is not written to disk.
    test_what_a_block_prints_outputs_and_fails_with_shows_as_stars_and_no_file_holds_it,
    test_a_value_typed_as_an_input_of_a_re_run_is_never_stored and
    test_the_python_environment_never_writes_the_value_to_a_file run them.
  taskloom/engine.py _Runner._run_block: >-
    One block's run, about seventy lines, in which the stage gives _filled Home.get_secret and has kept tables
    scrubbed (_scrub_tables, tested whole): test_a_reference_inside_a_settings_text_sends_the_value_and_the_log_shows_stars
    and test_a_value_in_a_table_cell_is_stored_as_stars run them.
  taskloom/engine.py _filled: >-
    The filling of a block's settings, which the stage only gives a secret function to pass on to _fill;
    braces.mutants.yaml tests it whole. The tests of {{secret:}} in tests/test_credentials_refs.py run it.
  taskloom/engine.py _fill: >-
    The filling of one setting, in which the stage passes the secret function to params.render (tested whole) and
    names a CredentialError as a setting it cannot fill; typed-values.mutants.yaml tests it whole.
    test_a_circle_reached_from_text_or_python_stops_the_run_naming_it_and_never_hangs runs the error.
  taskloom/engine.py _typed: >-
    The typed values of a block's inputs, in which the stage only passes the secret function on to _fill;
    typed-values.mutants.yaml tests it whole. No test types a reference as an input's value.
  taskloom/engine.py _only_inputs: >-
    The inputs of a block run alone, about thirty-five lines, in which the stage only passes Home.get_secret on; no
    test fills a reference in a block run alone.
  taskloom/flow.py validate: >-
    The whole of Validate, about a hundred and seventy lines, to which the stage added forty: every reference collected
    and named when it cannot be found, a parameter or input named secret refused, the warning for a secret in a
    command. tests/test_credentials_refs.py (validate_takes_a_reference, validate_names_every_missing,
    secret_with_a_name_not_written_as_text, flow_parameter_or_an_input_named_secret, secret_in_an_ssh_or_start_process)
    and test_validate_names_a_missing_card_or_key_that_a_connection_a_block_uses_names run them.
  taskloom/pyenv.py run_code: >-
    A Python Code block's run in your Python environment, about a hundred lines, to which the stage added the values
    sent on standard input, masked outputs (pyenv.masked, tested whole) and a secret of several lines hidden whole:
    test_python_code_gets_a_value_by_secret_and_it_is_in_no_environment_variable_or_argument,
    test_values_of_any_content_come_back_exactly_from_secret_in_python and
    test_the_python_environment_never_writes_the_value_to_a_file run them.
  taskloom/scheduler.py Scheduler.__init__: >-
    The scheduler's start, about forty lines, in which the stage has every notice it gives redacted:
    test_the_scheduler_says_an_email_could_not_be_sent_with_the_password_as_stars and
    test_the_schedulers_cannot_check_server_shows_a_cards_value_as_stars run it.
  taskloom/blocks/logic.py PythonCode.run: >-
    The run of a Python Code block, in which the stage reads each secret("CARD.key") the code names before it runs:
    test_values_of_any_content_come_back_exactly_from_secret_in_python and
    test_a_circle_reached_from_text_or_python_stops_the_run_naming_it_and_never_hangs run it.
  taskloom/blocks/logic.py PythonCode._run_here: >-
    Python Code run in Taskloom's own Python, about forty lines, to which the stage added secret(): the tests of
    secret() in tests/test_credentials_refs.py run it in both ways of running Python.
  taskloom/blocks/logic.py _message_source: >-
    Inspect's message as Python reads it, in which the stage shows {{secret:CARD.key}} as ***;
    braces.mutants.yaml tests it whole. test_a_reference_in_inspects_message_shows_as_stars runs it.
  taskloom/blocks/reports.py HtmlTemplate.problems: >-
    HTML Template's problems, about twenty lines, in which the stage leaves references out of the placeholders it
    checks; braces.mutants.yaml tests it whole.
    test_a_reference_in_an_html_template_puts_the_value_in_the_email_and_the_log_shows_none runs it.
  taskloom/blocks/reports.py HtmlTemplate.run: >-
    HTML Template's run, about twenty lines, in which the stage puts a reference's value in the email;
    braces.mutants.yaml tests it whole.
    test_a_reference_in_an_html_template_puts_the_value_in_the_email_and_the_log_shows_none runs it.
  taskloom/blocks/servers.py from_curl: >-
    Import from cURL, about a hundred and sixty lines, in which the stage names each secret found CARD.key (the host
    as the card): test_fill_in_stores_each_secret_as_a_row_of_the_card_typed_and_the_flow_and_its_commit_hold_only_references
    runs it.
  taskloom/editor/dialogs.py ConnectionsDialog.__init__: >-
    The Connections window, about a hundred and forty lines, to which the stage added the credential list beside the
    password: test_the_connections_window_picks_a_cards_row_for_a_token_stores_the_reference_and_test_connection_uses_it
    runs it.
  taskloom/editor/dialogs.py ConnectionsDialog._show_kind: >-
    The fields a kind of connection shows, about thirty lines, in which the stage shows or hides the password's row
    with its list: the test of the credential list runs it.
  taskloom/editor/dialogs.py ConnectionsDialog._test: >-
    Test connection, about twenty-five lines, in which the stage stops the test when _write (tested whole) could not
    store: test_connections_save_with_the_store_unavailable_says_so_naming_the_reason_and_stores_nothing runs Save, and
    the credential list's test runs Save and test connection.
  taskloom/editor/panels.py PropertiesPanel._fill_from_curl: >-
    Fill in of Import from cURL, about fifty lines, to which the stage added the store's all-or-none and its message:
    test_fill_in_stores_each_secret_as_a_row_of_the_card_typed_and_the_flow_and_its_commit_hold_only_references and
    test_fill_in_with_the_store_unavailable_says_so_naming_the_reason_and_changes_nothing run them.
  taskloom/editor/panels.py PropertiesPanel._secret_name: >-
    The question naming a secret found by Import from cURL, in which the stage asks for CARD.key: the Fill in tests
    run it.
  taskloom/editor/safety.py Safety.install_crash_log: >-
    The editor's crash log, about twenty-five lines, in which the stage redacts what it writes and prints:
    test_a_value_in_an_error_the_editor_does_not_catch_shows_only_as_stars_in_crash_log_the_terminal_and_the_box runs it.
  taskloom/editor/window.py MainWindow._make_actions: >-
    The editor's menus, about seventy lines, to which the stage added Tools > Credentials…: every test of
    tests/test_credentials_window.py opens the window through it.
  taskloom/editor/window.py MainWindow.copy_as_curl: >-
    Copy as cURL, about twenty lines, in which the stage gives _filled servers.hidden for secret() (a reference copies
    as <hidden: secret CARD.key>); no test copies a block holding a {{secret:}} reference as cURL.
