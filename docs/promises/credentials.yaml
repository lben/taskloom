# What must always be true of credentials on a PC, as agreed with the maintainer in chat on 2026-11-26.
# Each row is checked by the tests marked @pytest.mark.invariant("CR-<n>"); the proof's ledger is built from their
# results. Changing a row's words needs the maintainer's approval first.
feature: Credentials on the PC
agreed: 2026-11-26
# The maintainer's own words that led to these rows, with the date they were said.
asked:
  - date: 2026-11-11
    words: >-
      Credential Cards: a card such as UAT, PROD or UserA holds key/value rows, always one free row at the bottom; a
      value may reference another, so a DEFAULT card can point at UAT or PROD; credentials usable everywhere like
      inputs and parameters. "not plain files right?"
  - date: 2026-11-26
    # Q1 earlier secrets left alone (CR-7); Q3 one name whatever the case (CR-14); Q4 long values split (CR-17);
    # Q5 one real Windows store test on CI; Q6 the run stops first (CR-8); Q7 {{secret:...}} always a reference
    # (CR-18); Q8 by operating system (CR-13); Q9 secrets allowed in commands with a warning (CR-19).
    words: "1. a 3. a 4. a 5. a 6. a 7. a 8. a 9. a"
  - date: 2026-11-26
    # Renaming used by open flows (CR-16).
    words: "2. a but allow to rewrite the references in open flows as an option"
  - date: 2026-11-26
    words: "Approve all"
# The proofs on screen of this feature: the modules in tests/proofs whose names start so.
proofs: [test_proof_credentials]
rows:
  CR-1: >-
    Tools > Credentials opens a window: cards on the left, the chosen card's rows of key and value on the right, with
    always one empty row at the bottom. Cards and rows can be added, renamed and deleted. Save stores every change at
    once; Cancel stores none.
  CR-2: >-
    Every value shows as the same number of dots, so its length does not show either. The eye button at the right of
    a row shows that one value until it is pressed again or the window closes.
  CR-3: >-
    A card can take its values from another card; its own row for the same key wins. A row can point at another row.
    A chain is followed to its end. A circle (A uses B, B uses A) is refused when it is made, and one found in stored
    data is reported by name and never makes Taskloom hang.
  CR-4: >-
    A reference works as a whole field (secret:CARD.key), inside any text that takes placeholders
    ({{secret:CARD.key}}) and in Python Code (secret("CARD.key")). The Connections window picks a connection's
    password, token or key from the cards' rows. API Request's and Ask User's "Stored secret" fields take CARD.key.
    Import from cURL's Fill in stores each secret as a row of a card you choose.
  CR-5: >-
    A secret's value never shows and is never stored outside the credential store: not in the Log (also what a block
    prints), results and their table cells, Data preview, hovers, Run history, stored runs, the history database, the
    crash log, the terminal, error messages of taskloom commands, the Connections window's test message, the
    scheduler's messages and failure emails, "Copy executed query", the flow file or a commit. It shows as ***. The
    same holds for its URL-encoded form (as in a web address).
  CR-6: >-
    A value shorter than 4 characters cannot be hidden reliably inside text; the window says so on that row.
  CR-7: >-
    Values are in the operating system's credential store (Windows Credential Manager, macOS Keychain). The file
    listing cards and keys holds no value. Secrets stored before this version are not read: the release notes and
    the docs say how to enter them again as card rows and how to remove the old entries (on Windows named taskloom
    and NAME@taskloom).
  CR-8: >-
    Validate names every reference to a card or key that does not exist, with its block and field. A run stops before
    its first block and names every missing card, key or stored value it needs.
  CR-9: >-
    taskloom secret list shows cards and keys, never a value. taskloom secret set CARD.key takes the value from a
    hidden prompt or, with --stdin, from standard input; never from the command line itself. taskloom secret delete
    removes a row or a whole card.
  CR-10: >-
    In Python Code, secret("CARD.key") needs the name written in the code as text. Anything else (a variable, for
    example) is named by Validate as an error. This holds for both ways of running Python.
  CR-11: >-
    A value is put into text once: braces inside a secret's value are never filled.
  CR-12: >-
    Deleting a card or a row also removes its value from the credential store, not only from the list.
  CR-13: >-
    On Windows and macOS, when the credential store cannot be used, Taskloom says so and stores nothing; it never
    writes or reads a plain file there. On Linux the private file stays until stage 6.
  CR-14: >-
    Card and key names use letters, digits, _ and -. A dot or a space is refused with a message saying why (the dot
    separates card and key). Upper and lower case do not make another name: UAT and uat are the same card and cannot
    both exist, and a reference written uat.PASSWORD finds UAT.password.
  CR-15: >-
    When the list and the store disagree, a listed key with no stored value shows "no value stored" on its row, and a
    run that needs it stops and names it. Never a crash.
  CR-16: >-
    Renaming a card or key that open flows use shows a warning listing those flows and blocks, with a choice: rename
    only, or also rewrite the references in the open flows. The rewrite is applied on Save; each changed flow shows it
    as an unsaved change and Undo in that flow takes it back. Flows that are not open are not changed; Validate names
    their old references.
  CR-17: >-
    A value of any length is stored and read back whole. On Windows a value over the store's limit is split over
    several entries without the user seeing it, and deleting it removes every part.
  CR-18: >-
    {{secret:...}} is always a reference. Validate refuses a flow parameter or input named secret.
  CR-19: >-
    A secret is allowed in an SSH or Start Process command. Validate warns that other programs on that machine can see
    a command while it runs, and the Log shows ***.
