# The bugs proving Updates on Windows found, each fixed and guarded by a test since (the proof PDF counts and lists
# them before the details; tests/test_promises_found.py checks each test exists), and where it is checked more lightly.
found:
  - what: >-
      A disk that filled up while the zip downloaded was not caught: each failed write of the download showed as
      "Something went wrong" with a traceback, no message said that Taskloom was not updated, the download window
      stayed open at its last value, and the part of the download (.partial-*) stayed until the next start.
    found_by: the reviewer
    fixed_in: 2203ce7
    guarded_by: tests/test_updates.py::test_u3_a_disk_that_fills_up_during_the_download_says_so_and_leaves_nothing_behind
  - what: >-
      Check for updates had no time limit (charter C8): a server, proxy or firewall that took the connection and
      never answered left the check without a window or a message for ever, and a download that stalled held its bar
      until Cancel; each web call now ends after TIMEOUT_SECONDS (30 s) without a byte, with a message.
    found_by: the reviewer
    fixed_in: 2203ce7
    guarded_by: tests/test_updates.py::test_u3_a_check_that_gets_no_answer_says_so_within_the_time_limit
lighter:
  - "Taskloom's real GitHub releases are not asked: a local HTTPS server stands for the API, github.com and its hosts for release files, with Qt trusting a certificate made for the tests."
  - "No proxy is tried, nor TLS in the packaged build, nor the built Windows zip: a zip made by the tests stands for it, holding stand-in programs that cannot run."
  - "A full disk is stood in for: during the download, the file opened through Python's open takes a third of the zip, then each write fails (no space left on device); before unpacking, the disk's free space is faked."
  - "The time limit is 2 seconds in the tests, not 30; a server that takes the connection and never answers stands for a silent proxy or firewall."
  - "Shortcuts are read through Windows' own WScript.Shell on Windows only (elsewhere a JSON file stands for one), and no test logs in to Windows, opens the Start menu or pins Taskloom to the taskbar."
  - "The restart starts a stand-in program: a second editor of this version on the same Taskloom folder stands for the new version's."
  - "No real older release is tried: the older scheduler service is this version with its scheduler.version rewritten (in tests/test_scheduler_mutants_final.py, the test holding the folder's lock), and its hour without a quiet moment is stood in for by rewriting scheduler.waiting or by the test's clock."
