# How each agreed row of docs/promises/load-state.yaml is kept, and why a row is not green (read by packaging/ledger.py;
# the reviewer checks these words against the code). A feature with no model to check: its rows are amber, checked by
# tests only (tests/test_load_state.py, rows L1..L17 of the stage's plan), and not_green says what the tests leave out.
LS-1:
  enforced: >-
    MainWindow._run_menu (taskloom/editor/window.py) adds "Load run state" to Run history's menu, which calls
    MainWindow.load_state for the current tab. load_state names the run in the tab (_set_state: the run's number
    and start time, from History.label), shows it (_show_state) and its Log. _show_state takes each block's result
    in that run from History.blocks and, for a re-run, follows History.carried_on_from (taskloom/history.py) back
    from run to run for the blocks it carried over, each read from the run it ran in, the newest first; Loop items
    and Merger lines come with those results. _show_bar shows the bar (FlowTab.bar, above the canvas) with its
    words and FlowTab.leave. A double-click still calls MainWindow.show_history_run, which only ends a loaded
    state first (_set_state(tab, None)) and shows the run once, as before.
  not_green: >-
    Tests (L1, L4, L8, L10, L11, L17) load a failed run, a second run over a first, a Loop over 5 items, a Merger
    set to each line, a request in a Session, re-runs that carried blocks over (also inside a Loop) and the oldest
    of the 200 runs listed, and double-click a run; no check tries every shape of flow, e.g. a Loop inside a Loop,
    or every chain of re-runs.
LS-2:
  enforced: >-
    MainWindow.inputs_run returns the loaded run (FlowTab.state_run) for a block that, or a block before which,
    shows a result, so rerun_block, run_block_with_inputs and the menu's words (_block_menu_for) all take it.
    start_run, for a re-run, leaves the state loaded and the canvas as it is; MainWindow._on_event, at the
    re-run's run_started, makes the re-run the loaded run (_set_state), so the bar names it and the next re-run
    takes its inputs from it. The engine's re-run carries the loaded run's folder over (_carry_over), and
    MainWindow._mark_old greys as old the blocks after it that it did not reach.
  not_green: >-
    Tests (L2, L3, L4, L8) fix a failed block and run from it on, run two blocks alone one after the other, load a
    second state and re-run a request in a Session, and read what each block received; they read that the bar
    names the re-run, not the rest of its words. The proof found that the bar says the re-run's files were cleaned
    up until the editor's next look, 2 seconds later (the re-run's folder is made after it starts). No check tries
    every flow or every order of re-runs.
LS-3:
  enforced: >-
    MainWindow.start_run ends a loaded state for a full run (_set_state(tab, None)) and, as the canvas no longer
    follows the newest runs, shows each block's newest result (_show_results) before the run's own results come.
    The bar's Leave button calls MainWindow.leave_state, which ends the state and shows the newest results.
  not_green: >-
    Tests (L13) press Leave, then Run now from a loaded state, and read the bar and every block; no check tries a
    full run started by its Schedule block from the editor, or a run of one start block of several.
LS-4:
  enforced: >-
    _Runner._keep_outputs (taskloom/engine.py) lists in a block's saved outputs those it did not save
    (__withheld__) and, apart, those not saved because they held a password (__passwords__). not_kept reads them
    for the loaded run's folder, with the reason (_why_not_kept), and MainWindow._show_state hands them to the
    block, whose hover names each output with "value not kept:" and its reason (FlowScene.show_result,
    taskloom/editor/canvas.py). A re-run that needs such a value is refused by _block_inputs or _from_before with
    the same reason, before any run is recorded, and the editor writes the refusal in the Log.
  not_green: >-
    Tests (L9) load a run where an Ask User gave a password (a stored secret) and a Python block an open database
    connection, read both blocks' hover, and re-run the blocks that need them (refused, with the right reason and
    not the other) and one that does not (it runs); no check tries every kind of value that cannot be saved, text
    built from a password, or a value inside a Loop's items.
LS-5:
  enforced: >-
    The loaded run is kept on its FlowTab (state_run). MainWindow._show_state stops the tab following the newest
    runs (following_latest), so MainWindow._refresh_statuses, every 2 seconds, does not put runs that finished
    meanwhile on it (_load_last_run), while it still lists them in Run history (_refresh_history). Another tab's
    runs and state are its own.
  not_green: >-
    Tests (L5, L16) finish a run as the scheduler service starts it, a run from a terminal and a run of another
    flow in another tab while a state is loaded, and load a state in one of two tabs; the scheduler service itself
    is not running in them (its run is started as it starts it), and no check tries every order of runs ending.
LS-6:
  enforced: >-
    Loading only reads: History.run, History.blocks, History.label, History.version and History.carried_on_from
    read the run history, not_kept and MainWindow._not_loadable read the run's folder, and _set_state writes only
    the editor's own settings (editor.ini). A re-run from the state is a run of its own (run_flow), whose new folder
    starts as a copy of the loaded run's.
  not_green: >-
    Tests (L12) compare the checksums of every file of the loaded run's folder and of the run after it, and the
    loaded run's rows in the history, after loading, Leave, loading again, a refused re-run, a re-run and closing
    Taskloom; no check tries every way of working with a loaded state, e.g. Bring back the flow as it was.
LS-7:
  enforced: >-
    MainWindow._not_loadable greys "Load run state" in Run history's menu, its text saying why: "still going" for a
    run whose status is running, "its files are gone: cleaned up or deleted" when the run's folder is gone or lacks
    the saved results of a block that ended in it (a block inside a Loop: the Loop's). While a run is loaded,
    MainWindow._refresh_statuses looks at its folder every 2 seconds: _show_bar then says its files were cleaned up
    (Keep runs, keep_runs_for) and that nothing can be re-run from it, and MainWindow.rerun_block refuses a re-run
    with that reason in the Log before anything runs.
  not_green: >-
    Tests (L6, L7, L10) clean a loaded run up with Keep runs, delete a block's folder, delete a run's folder by hand,
    stop a run at once, look at a run still going, and clean up the run a carried block ran in; no check tries a
    folder only partly deleted by Windows (a file still open), and the bar's words are wrong for up to 2 seconds
    after a re-run starts (see LS-2).
LS-8:
  enforced: >-
    MainWindow.load_state asks first when _changed_since finds that the flow file's bytes now are of another version
    (flow.version_id) than the one the run read (History.version). The question offers "Show on today's flow",
    "Bring back the flow as it was" (greyed, with a tooltip saying why, when _flow_as_it_was does not find that
    version in the file's Git history) and Cancel, which changes nothing. Bring back puts that version in the tab
    as one undo step (FlowDocument.restore, taskloom/editor/document.py) and keeps the step (FlowTab.brought_back).
    _show_state leaves out the results of blocks no longer in the tab's flow. _show_bar says which was chosen, and
    after Undo (FlowDocument.in_effect, MainWindow._on_doc_changed) today's flow. MainWindow._ready_to_run asks
    "Save the flow as it was?" before a re-run saves the brought-back flow, only while that step is in the tab and
    not saved; No saves and runs nothing. MainWindow.save forgets the step once it is saved.
  not_green: >-
    Tests (L14) change a flow committed in a Git repository of the test's own (a block deleted, one added), answer
    Cancel, Show on today's flow and Bring back, press Undo and Redo once, re-run and answer No, and load a run of a
    flow in no repository and of a flow unchanged; no check tries every history of edits between the run and
    today, a flow renamed or moved in Git, or answering Yes and then editing and re-running again.
LS-9:
  enforced: >-
    MainWindow._set_state remembers the loaded run in editor.ini, under the flow file's key (_flow_key "state"), and
    forgets it when the state ends; MainWindow._remove_tab ends it when a tab is closed, not when Taskloom quits.
    MainWindow.add_tab loads it again (_restore_state) when the flow opens; if its run or folder is gone,
    _restore_state ends it and the bar says the run was cleaned up since, while the tab shows the newest results;
    if the flow changed, it is shown on today's flow without asking.
  not_green: >-
    Tests (L15) close Taskloom with states loaded in two tabs (one of them a re-run), clean one run up from a
    terminal, and start Taskloom again in the same process; no check starts it in a new process, closes a tab that
    has a state loaded, or changes the flow while Taskloom is closed.

# The checker of this feature: mutation testing of the functions the change touched, which are the scope in
# load-state.mutants.yaml. CI runs it in the checkers-features job (.github/workflows/build.yml).
checkers:
  - name: Mutation testing
    kind: mutation
    command: python packaging/mutants.py . --run --explained docs/promises/load-state.mutants.yaml --out {out}/mutants.json
    key: '^(PASSED|FAILED): mutation score'
