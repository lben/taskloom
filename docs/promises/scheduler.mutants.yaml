# The service's outer shell is not mutation-tested (the maintainer's decision, 2026-11-08): it starts processes, Qt's
# tray, SSH sessions on servers and Windows' Startup folder, and waits in real time, which no test forked from mutmut's
# process does in about a second. The 90% bar is for the code that decides what runs and when. packaging/mutants.py
# lists each function below with its number of mutants and leaves them out of the score; these are the slow tests and
# proofs (tests/proofs, on screen in the proof PDF) that cover it instead.
not_tested:
  taskloom/scheduler.py serve: "The service process itself (its lock, scheduler.pid and scheduler.version, signals, its loop of checks), so a test must start `taskloom scheduler --headless` as a process: test_scheduler_start_at.py::test_the_headless_service_begins_a_run_at_its_time_and_its_process_counts_against_the_limit, test_scheduler_stops_and_sleeps.py (a service stopped or killed), test_scheduler_while_off.py::test_the_real_service_turned_off_just_before_a_time_runs_that_time_once_when_turned_on_again, test_scheduler_promises.py::test_of_several_services_started_at_the_same_moment_only_one_runs; on screen, test_proof_history_list.py and test_proof_interval_schedules.py turn it on."
  taskloom/scheduler.py _serve_tray: "The tray icon service (Qt's tray, its menu, the catch-up dialog, its timer of checks; the functions inside it are its mutants too) needs Qt, and a process forked after Qt has started can hang: test_paths_scheduler.py::test_the_tray_service_shows_failed_and_skipped_runs_as_tray_messages, test_scheduler_on_time.py::test_the_tray_scheduler_starts_a_runs_process_at_its_time_not_before_and_the_run_begins_within_5_seconds, test_scheduler_new_promises.py::test_the_tray_service_asks_in_a_dialog_and_runs_only_the_latest_n_chosen and ::test_the_tray_icons_turn_off_asks_flow_by_flow_cancel_keeps_it_on_proceed_follows_each_choice, test_scheduler_held_times.py::test_the_tray_service_tells_a_failed_check_once_and_goes_on_checking, test_service_off.py::test_turning_the_service_off_from_its_tray_icon_keeps_it_off."
  taskloom/scheduler.py _tray_available: "Asks Qt whether this PC has a tray, so it needs Qt: every tray service test of _serve_tray reaches it only through this (they make the offscreen platform show a tray), test_paths_scheduler.py::test_a_scheduler_started_at_login_while_on_runs_and_says_which_taskloom_it_is starts without --headless where there is none, and test_charter.py::test_only_the_editor_and_the_tray_icon_use_qt keeps Qt in these two functions."
  taskloom/scheduler.py _keeper_loop: "The keeper's thread in the service, which checks the servers every 5 minutes in real time: test_paths_scheduler.py::test_the_scheduler_service_keeps_the_servers_scheduler_running_and_says_so starts the real service (tray and headless) and sees the keeper start the server's scheduler and say so."
  taskloom/scheduler.py Scheduler.check_servers: "Checks and starts each server's scheduler over SSH and waits for it to check, so each case needs the test SSH server and real processes: test_paths_scheduler.py's keeper tests (::test_the_keeper_leaves_a_server_scheduler_that_is_running_alone, ::test_the_keeper_starts_a_server_scheduler_that_is_hung_or_gone, ::test_the_keeper_replaces_a_hung_server_scheduler_or_says_it_could_not, ::test_a_server_the_keeper_cannot_check_is_told_clearly, ::test_a_mistake_in_settings_does_not_stop_the_keeper_for_good), test_keeper_lock.py, test_servers.py::test_keeper_starts_and_restarts_the_server_scheduler, test_paths_cli_config.py::test_the_keeper_starts_the_scheduler_on_a_server_where_it_is_not_running; on screen, test_proof_keeper_lock.py."
  taskloom/scheduler.py Scheduler._remote_alive: "Reads the server scheduler's process and heartbeat with a shell command run on the server over SSH: test_paths_scheduler.py::test_the_keeper_leaves_a_server_scheduler_that_is_running_alone and ::test_the_keeper_starts_a_server_scheduler_that_is_hung_or_gone, test_keeper_lock.py::test_the_keeper_replaces_the_scheduler_it_keeps_on_a_server_once_it_hangs; on screen, test_proof_keeper_lock.py."
  taskloom/scheduler.py Scheduler._lock_holders: "Finds the processes that hold the server's scheduler.lock through /proc or lsof, with a shell command run on the server over SSH: test_keeper_lock.py::test_the_keeper_signals_no_other_process_when_it_replaces_a_hung_scheduler, ::test_after_a_reboot_the_process_that_got_the_pid_in_scheduler_pid_is_left_alone and ::test_where_the_keeper_cannot_tell_which_process_holds_the_lock_it_stops_nothing_and_says_why; on screen, test_proof_keeper_lock.py."
  taskloom/scheduler.py Scheduler._stop_lock_holders: "Stops a hung server scheduler over SSH (SIGTERM, then SIGKILL 5 s later) and waits in real time for it to end: test_keeper_lock.py::test_the_keeper_asks_the_hung_scheduler_to_stop_and_forces_it_only_while_it_still_holds_the_lock and ::test_the_keeper_signals_no_other_process_when_it_replaces_a_hung_scheduler; on screen, test_proof_keeper_lock.py."
  taskloom/scheduler.py Scheduler._start_problem: "Waits, a second at a time, for the server scheduler just started to check, reading its exit code, heartbeat and log over SSH: test_paths_scheduler.py::test_the_keeper_does_not_say_it_started_a_server_scheduler_whose_command_does_not_exist and ::test_the_keeper_replaces_a_hung_server_scheduler_or_says_it_could_not, test_keeper_lock.py::test_where_the_keeper_cannot_tell_which_process_holds_the_lock_it_stops_nothing_and_says_why; on screen, test_proof_keeper_lock.py."
  taskloom/scheduler.py startup_file: "Where Windows' Startup folder is (from APPDATA), for start at login, which decides nothing about what runs or when: test_scheduler.py::test_start_at_login_puts_its_script_in_the_windows_startup_folder_for_this_taskloom_folder, test_scheduler_service_calls.py::test_starting_at_login_anywhere_but_windows_says_it_is_for_windows_only, test_paths_cli_config.py::test_scheduler_at_login_where_there_is_no_startup_folder_says_so_without_a_crash."
  taskloom/scheduler.py startup_script: "The start-at-login script's text, whose quoting and code page only cmd.exe at login shows: test_scheduler.py::test_start_at_login_writes_a_startup_script and ::test_a_start_at_login_script_says_which_version_starts, test_paths_scheduler.py::test_start_at_login_starts_the_scheduler_from_a_folder_whose_name_has_an_ampersand (run by cmd.exe on Windows), test_paths_cli_config.py::test_start_at_login_starts_the_scheduler_also_when_a_folder_name_has_an_accent."
