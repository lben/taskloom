# The mutants of the scheduler feature (taskloom/schedule.py, taskloom/scheduler.py) that the tests let through, each
# with why it changes nothing a user could notice (read by packaging/mutants.py --explained). A mutant a user could
# notice in a case a row covers needs a test instead.
taskloom.schedule.x__monday_first__mutmut_9: "The days here are 0 to 6 (a 7 in a cron line is read as 0 first), and for those, counting from Monday modulo 8 gives the same order as modulo 7: Monday to Saturday, then Sunday."
taskloom.schedule.x_clock_moment__mutmut_6: "The search only does something for a time the clock skips (first reading later than the second); for a time shown once both readings are the same moment, so the search stops at once and returns that moment either way."
taskloom.schedule.x_clock_moment__mutmut_15: "The search runs only for a time the clock skips, which the clock never shows, so no second shows exactly that time: 'later than it' and 'it or later' pick the same second."
taskloom.schedule.x_plan_cron__mutmut_34: "plan_cron is only given the editor's own plans and the plans cron_plan returns, whose kind it always knows: no flow, file or input reaches this message."
taskloom.schedule.xǁAtǁ__init____mutmut_2: "A one-off time read as a date and time (as YAML reads an unquoted 2026-10-08 15:30:00) is written as text and read back: the same date, time and UTC offset; only Python's fold mark would be lost, and nothing that reads a flow sets it."
taskloom.schedule.xǁCronǁ__init____mutmut_5: "Nothing reads Cron.expr: the cron line shown, saved and used to tell schedules apart is the flow's own text (Trigger.text)."
taskloom.schedule.xǁCronǁnext_after__mutmut_14: "The rarest time a cron line can have is 29 February, at most 2,921 days apart (2096 to 2104, as 2100 is no leap year); the search already covers 2,928 days, so a longer one finds nothing more and only takes longer to say a line never comes (31 February)."
taskloom.schedule.xǁCronǁnext_after__mutmut_15: "The rarest time a cron line can have is 29 February, at most 2,921 days apart (2096 to 2104, as 2100 is no leap year); the search already covers 2,928 days, so a longer one finds nothing more and only takes longer to say a line never comes (31 February)."
taskloom.schedule.xǁTriggerǁ__init____mutmut_14: "The message's example would read 0 7 * * mon-fri instead of MON-FRI, which works the same (weekday names are read in any case), so the example still works as written."
taskloom.schedule.xǁTriggerǁ__init____mutmut_58: "A one-off time is to the second (one with a fraction of a second is refused), and for such a time isoformat writes the seconds and no fraction whether or not it is told to stop at the seconds: the schedule's text is the same."
taskloom.schedule.xǁTriggerǁnext_after__mutmut_14: "The clock time found is always later than the clock time at t, and the moment the clock first shows a later time (or jumps past it) is always after t, never t itself: 'after t' and 't or after' give the same time."
