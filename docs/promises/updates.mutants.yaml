# Mutation testing of updating Taskloom on Windows (read by packaging/mutants.py --explained). scope: what the bugs are
# planted in, the functions the change touched, in groups: each group's bugs run the tests that can see them (each
# line of tests: is one pytest run, a file with -k words or without). The functions that are new are tested whole. A
# function in which the change touched a line or a few, among much that was there before, is under not_tested: its
# bugs are planted and counted, not run, and its reason names the tests that check the changed lines. So are the
# shortcut functions that call Windows' own shell-link interface: mutation testing runs on Linux (CI's
# checkers-features job), where they cannot run, and the tests replace them there by a JSON file standing in for a
# shortcut. Nothing is planted in the change's other lines: entries._locked is a context manager (mutmut plants
# nothing in a decorated function), and test_u6_two_quick_starts_of_the_new_version_write_each_entry_once_and_whole
# checks it; mutmut finds nothing it can change in UpdateDownload.reject (Cancel: it sets the stop and aborts the
# download), which test_u1_cancel_during_the_download_leaves_nothing_behind checks; the constants
# (update.RELEASE_URL, ASSET, HOSTS, MARKER, TIMEOUT_SECONDS; entries.WINDOWED, EDITOR, SCHEDULER and the shell-link
# interfaces' ids), the classes update.Failed and update.Release, UpdateDownload's two signals and the imports are not
# functions (update.TIMEOUT_SECONDS is read only by _ask, mutated whole below, and the time-limit tests
# test_u3_a_check_that_gets_no_answer_says_so_within_the_time_limit and
# test_u3_a_download_that_stalls_ends_within_the_time_limit_and_leaves_nothing_behind set it to 2 s); the lines
# removed (the question "Restart the scheduler service?" in
# MainWindow._show_scheduler_state, restart_scheduler and _update_start_at_login in window.py, three lines of
# MainWindow.__init__, and scheduler.py's startup_file, startup_script, _in_script, startup_script_outdated and
# set_start_at_login, which entries.py replaces) leave nothing to plant a bug in. The take-over itself
# (scheduler.py: serve, _take_over, _quiet, _stop_old) is mutated with the rest of scheduler.py by the scheduler's
# mutation testing (scheduler.mutants.yaml).
# The mutants the tests let through are explained here, by kind (kinds: a kind, its why, the mutants it explains) or
# one by one (mutant name: why it changes nothing a user could notice). Only those no user could notice are
# explained: the others stay without a reason until a test catches them.
scope:
  mutate:
    # Help > Check for updates: the release asked of GitHub, the download, its checks and the unpacking.
    - mutate:
        - taskloom/update.py programs
        - taskloom/update.py refused
        - taskloom/update.py newer_release
        - taskloom/update.py installed
        - taskloom/update.py partial
        - taskloom/update.py unpack
        - taskloom/update.py _sha256
        - taskloom/editor/window.py MainWindow._make_actions
        - taskloom/editor/window.py MainWindow.check_for_updates
        - taskloom/editor/window.py MainWindow._web
        - taskloom/editor/window.py MainWindow._release_told
        - taskloom/editor/window.py MainWindow._install
        - taskloom/editor/window.py _ask
        - taskloom/editor/window.py _failure
        - taskloom/editor/window.py UpdateDownload.__init__
        - taskloom/editor/window.py UpdateDownload._received
        - taskloom/editor/window.py UpdateDownload._downloaded
        - taskloom/editor/window.py UpdateDownload._unpack
        - taskloom/editor/window.py UpdateDownload._unpacking
        - taskloom/editor/window.py UpdateDownload._end
      tests:
        - tests/test_updates.py -k "u1_ or u2_no_newer or u3_"
    # After the install: the entries and the service put in use, and the restart offered.
    - mutate:
        - taskloom/update.py put_in_use
        - taskloom/update.py start
        - taskloom/editor/window.py MainWindow._installed
        - taskloom/editor/window.py MainWindow._restart_in
        - taskloom/editor/window.py main
      tests:
        - tests/test_updates.py -k "u1_u9 or u4_an_install or u7_an_install or u8_ or entries_cannot_change_yet"
    # The Start menu and Startup entries, and what each start of the packaged Windows Taskloom does: the entries
    # follow the newest version, and older versions Taskloom installed are removed.
    - mutate:
        - taskloom/entries.py startup
        - taskloom/entries.py start_menu
        - taskloom/entries.py set_entry
        - taskloom/entries.py follow
        - taskloom/entries.py _older
        - taskloom/entries.py version_of
        - taskloom/entries.py _script_home
        - taskloom/entries.py _write
        - taskloom/entries.py read_link
        - taskloom/entries.py write_link
        - taskloom/entries.py _shell_link
        - taskloom/entries.py _guid
        - taskloom/entries.py _call
        - taskloom/cli.py _at_start
        - taskloom/cli.py main
        - taskloom/cli.py cmd_scheduler
        - taskloom/cli.py cmd_editor
        - taskloom/update.py clean_up
        - taskloom/update.py _yours
        - taskloom/update.py _remove
        - taskloom/update.py _marker
        - taskloom/update.py _key
        - taskloom/editor/dialogs.py SettingsDialog.__init__
        - taskloom/editor/dialogs.py SettingsDialog._save
      tests:
        - tests/test_updates.py -k "u4_ or u5_ or u6_two_quick_starts or u10_"
        - tests/test_scheduler.py -k at_login
        - tests/test_paths_cli_config.py -k at_login
        - tests/test_paths_scheduler.py -k "starting_at_login or start_at_login"
        - tests/test_scheduler_service_calls.py -k at_login
    # The editor starts this version's scheduler service also when an older one runs, which it then takes over.
    - mutate:
        - taskloom/editor/window.py MainWindow._scheduler_to_start
        - taskloom/editor/window.py MainWindow._sync_schedule
        - taskloom/editor/window.py MainWindow._start_scheduler_if_needed
        - taskloom/editor/window.py MainWindow.start_scheduler
      tests:
        - tests/test_editor.py -k "older_scheduler_running_is_taken_over or started_beside_an_older_one"
        - tests/test_paths_scheduler.py -k older_scheduler_service_is_taken_over
        - tests/test_service_off.py -k older_service_that_cannot_be_stopped
        - tests/test_updates.py -k turned_on_again_while_this_versions_service_still_runs
not_tested:
  taskloom/editor/window.py MainWindow._make_actions: >-
    The editor's menus and toolbar as they are built, about 66 lines, to which this change added two (Help > Check
    for updates…, only in the packaged Windows Taskloom):
    test_u2_help_has_check_for_updates_only_in_the_windows_taskloom checks them, and each test of the download clicks
    the item.
  taskloom/editor/window.py main: >-
    The editor's start, to which this change added two lines (what Taskloom's start has to tell shows in the status
    bar): test_u4_the_first_start_of_a_newer_version_unpacked_by_hand_points_the_entries_at_itself, with a folder
    that is gone and the editor, reads it there. The rest, the application and its window made and shown, is as it
    was.
  taskloom/editor/window.py MainWindow._sync_schedule: >-
    A flow's schedule applied when it is saved, about 30 lines, in which this change made one condition start this
    version's service also when an older one runs (_scheduler_to_start, mutated whole above):
    test_an_older_service_that_cannot_be_stopped_is_called_on_and_not_taken_over saves a scheduled flow while an older
    service runs.
  taskloom/editor/window.py MainWindow._start_scheduler_if_needed: >-
    The service started when flows are scheduled, in which this change made the same condition call
    _scheduler_to_start: test_an_older_scheduler_running_is_taken_over_without_a_question opens the editor while an
    older service runs and sees it start this version's.
  taskloom/editor/window.py MainWindow.start_scheduler: >-
    The service started, about 18 lines, in which this change made the same condition call _scheduler_to_start and
    removed a line: test_an_older_scheduler_service_is_taken_over_by_this_versions_without_a_question and
    test_this_versions_service_started_beside_an_older_one_takes_over_the_old_one_stopping_first start the real one
    beside an older service.
  taskloom/editor/dialogs.py SettingsDialog.__init__: >-
    Settings as it is built, about 100 lines, in which this change put "Add Taskloom to the Start menu" next to "Start
    the scheduler service when I log in", each ticked when its shortcut exists and greyed out outside the packaged
    Windows Taskloom: test_u4_settings_adds_and_removes_the_start_menu_entry_next_to_starting_at_login and
    test_the_settings_box_start_at_login_adds_and_removes_this_folders_startup_entry check them.
  taskloom/editor/dialogs.py SettingsDialog._save: >-
    Settings saved, about 23 lines, in which this change made the two boxes write or remove their shortcuts
    (entries.set_entry, mutated whole above): the same two tests tick, untick and save them and read the shortcuts.
  taskloom/cli.py main: >-
    The command line read, about 100 lines, to which this change added --home, the start hook (_at_start, mutated whole
    above) and printing what it has to tell on stderr:
    test_u4_home_given_on_the_command_line_is_the_taskloom_folder_used and
    test_u4_the_first_start_of_a_newer_version_unpacked_by_hand_points_the_entries_at_itself check them.
  taskloom/cli.py cmd_scheduler: >-
    taskloom scheduler, in which this change made --at-login write the Startup shortcut (entries.set_entry, mutated
    whole above) and passes what the start has to tell to the service: the --at-login tests of test_scheduler.py,
    test_paths_cli_config.py and test_scheduler_service_calls.py check the first; the service's tray message is not
    checked by a test.
  taskloom/cli.py cmd_editor: >-
    taskloom editor, to which this change added what the start has to tell, passed on to the editor:
    test_u4_the_first_start_of_a_newer_version_unpacked_by_hand_points_the_entries_at_itself reads it in the editor's
    status bar.
  taskloom/entries.py read_link: >-
    Reads a shortcut through Windows' shell-link interface, which Linux, where mutation testing runs, does not have;
    on Windows every entries test reads what it wrote through Windows' own WScript.Shell, not through this code.
  taskloom/entries.py write_link: >-
    Writes a shortcut through Windows' shell-link interface (Windows only, as read_link); on Windows the entries tests
    read each shortcut it wrote through WScript.Shell.
  taskloom/entries.py _shell_link: >-
    Makes the shell-link object read_link and write_link use (Windows only); the same tests run it on Windows.
  taskloom/entries.py _guid: >-
    An interface's id for _shell_link (Windows only); the same tests run it on Windows.
  taskloom/entries.py _call: >-
    Calls a method of the shell-link object (Windows only); the same tests run it on Windows.
kinds:
  - kind: The same codec named in capital letters
    why: >-
      Python reads "UTF-8" as "utf-8": the same codec.
    mutants:
      - taskloom.update.x_unpack__mutmut_56
      - taskloom.update.x_unpack__mutmut_111
      - taskloom.entries.x__script_home__mutmut_4
      - taskloom.entries.x_version_of__mutmut_6
      - taskloom.update.x__marker__mutmut_6
      - taskloom.update.x_clean_up__mutmut_34
  - kind: A file of plain ASCII read or written in the locale's encoding
    why: >-
      The marker is written by json.dumps, which writes every character beyond ASCII as \uXXXX, and a VERSION file
      holds a version (digits and dots): plain ASCII, the same in UTF-8 and in each code page Windows uses.
    mutants:
      - taskloom.update.x_unpack__mutmut_100
      - taskloom.update.x_unpack__mutmut_102
      - taskloom.update.x__marker__mutmut_3
      - taskloom.entries.x_version_of__mutmut_1
  - kind: The Startup script read in the locale's encoding
    why: >-
      On Linux, where mutation testing runs, the locale's encoding is UTF-8, the one named, so a script is read the
      same (one not in UTF-8 too); on Windows (a code page)
      test_u4_todays_startup_script_is_replaced_by_a_shortcut_for_its_taskloom_folder, whose Taskloom folder is
      named with an é, catches it in today's script, and
      test_u4_a_startup_script_that_names_no_taskloom_folder_is_kept_and_the_start_says_why, whose kept script starts
      a version in a folder named with an é, catches it in the cleanup (that version would be removed).
    mutants:
      - taskloom.entries.x__script_home__mutmut_2
      - taskloom.update.x_clean_up__mutmut_29
      - taskloom.update.x_clean_up__mutmut_31
  - kind: Windows' process flags, which Linux does not have
    why: >-
      On Linux, where mutation testing runs, subprocess has neither DETACHED_PROCESS nor CREATE_NO_WINDOW, so the
      flags are 0 (the same as none) either way; on Windows the U7 and U8 tests check them (started_on_its_own:
      detached, no console window).
    mutants:
      - taskloom.update.x_start__mutmut_12
      - taskloom.update.x_start__mutmut_21
      - taskloom.update.x_start__mutmut_22
      - taskloom.update.x_start__mutmut_28
      - taskloom.update.x_start__mutmut_29
      - taskloom.update.x_start__mutmut_31
      - taskloom.update.x_start__mutmut_37
      - taskloom.update.x_start__mutmut_38
  - kind: start_new_session, which Windows ignores
    why: >-
      Python makes a new session (setsid) only on POSIX and ignores the argument on Windows, the only place a Taskloom
      updates itself (Check for updates and the restart are in the packaged Windows Taskloom only).
    mutants:
      - taskloom.update.x_start__mutmut_5
      - taskloom.update.x_start__mutmut_11
      - taskloom.update.x_start__mutmut_18
      - taskloom.update.x_start__mutmut_19
      - taskloom.update.x_start__mutmut_20
  - kind: How much of the download is read at a time for its checksum
    why: >-
      Blocks of 1 MB, 2 MB or the whole file at once give the same SHA-256.
    mutants:
      - taskloom.update.x__sha256__mutmut_13
      - taskloom.update.x__sha256__mutmut_15
      - taskloom.update.x__sha256__mutmut_16
  - kind: A digest GitHub does not give
    why: >-
      With no digest the release's is "" or "XXXX": neither starts with "sha256:", so neither is checked.
    mutants:
      - taskloom.update.x_newer_release__mutmut_53
  - kind: Exactly as many bytes free as the files take
    why: >-
      Files take whole clusters of the disk and the marker more: with exactly as many bytes free as the files hold,
      the unpack fails either way, before it (not enough disk space) or as it writes (could not unpack); nothing is
      installed and the message says so.
    mutants:
      - taskloom.update.x_unpack__mutmut_64
  - kind: HTTP header names in other letter case
    why: >-
      HTTP reads header names the same in capital and in small letters (RFC 9110): accept is Accept.
    mutants:
      - taskloom.editor.window.x__ask__mutmut_9
      - taskloom.editor.window.x__ask__mutmut_10
      - taskloom.editor.window.x__ask__mutmut_16
      - taskloom.editor.window.x__ask__mutmut_17
  - kind: The network manager made again, or without a parent
    why: >-
      A new QNetworkAccessManager for each check, or one with no parent (the editor keeps it), asks the same, through
      the same proxy settings, and gets the same answers.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_web__mutmut_1
      - taskloom.editor.window.xǁMainWindowǁ_web__mutmut_6
      - taskloom.editor.window.xǁMainWindowǁ_web__mutmut_7
      - taskloom.editor.window.xǁMainWindowǁ_web__mutmut_12
  - kind: Windows' proxy settings
    why: >-
      Without a proxy set on the machine (as on every test machine) asking directly and asking through the system's
      proxy settings are the same; a test cannot set a proxy in Windows' settings (they are the machine's and the
      user's, not the test's). Not equivalent where a proxy is set: no test checks it.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_web__mutmut_10
  - kind: How long the status bar says where the new version is installed
    why: >-
      30 seconds, 30.001 seconds, or until the next message replaces it: what it says is the same; how long it shows
      is no promise.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_installed__mutmut_13
      - taskloom.editor.window.xǁMainWindowǁ_installed__mutmut_16
  - kind: A widget the layout takes in
    why: >-
      A label or button made without a parent, or for no window, is given the restart window as its parent when the
      window's layout takes it in: the same window, with the same text and Cancel.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_11
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_13
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_15
  - kind: Stretch where there is no space to share
    why: >-
      The window is shown at its own size, so no space is left over for the stretch to give: Cancel is where it was.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_28
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_42
  - kind: A timer's parent
    why: >-
      The timer is kept by what uses it, stopped by Cancel or the end, and with a parent or without it fires the same.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_30
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_32
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_66
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_68
  - kind: How often a wait looks
    why: >-
      Every second (restart) or 100 ms (unpacking), a millisecond more, or as soon as the editor is idle: the end of
      the flows or of the unpack is seen and acted on the same; only the processor works more meanwhile.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_33
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_34
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_69
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_70
  - kind: A running flow always has its file
    why: >-
      The editor runs a flow from its file (Run saves it first), so each running one has a path: its name is the
      file's name without .yaml either way.
    mutants:
      - taskloom.editor.window.xǁMainWindowǁ_restart_in__mutmut_41
  - kind: The progress bar's ends where it shows the same
    why: >-
      0 to 1, 0 to 2, 1 to 1 with nothing done yet, or a minimum of 1 instead of 0 against 1.5 MB: the bar is empty at
      the start, and after that its fill differs by less than a pixel; a release is never under 2 bytes (a zip is at
      least 22), nor what it unpacks to (VERSION alone holds the version).
    mutants:
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_12
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_20
      - taskloom.editor.window.xǁUpdateDownloadǁ__init____mutmut_25
      - taskloom.editor.window.xǁUpdateDownloadǁ_unpacking__mutmut_6
      - taskloom.editor.window.xǁUpdateDownloadǁ_unpacking__mutmut_11
  - kind: The unpacking thread as a daemon or not
    why: >-
      It matters only when Python ends while a zip unpacks (a second or so), and the editor does not end then: it
      closes after the unpack's end or its Cancel. A .partial-* folder left is removed at the next start either way.
    mutants:
      - taskloom.editor.window.xǁUpdateDownloadǁ_downloaded__mutmut_16
      - taskloom.editor.window.xǁUpdateDownloadǁ_downloaded__mutmut_18
      - taskloom.editor.window.xǁUpdateDownloadǁ_downloaded__mutmut_19
  - kind: A close that fails after every write of the download did
    why: >-
      Python writes each received block at once (a write that fails ends the download,
      test_u3_a_disk_that_fills_up_during_the_download_says_so_and_leaves_nothing_behind); a close that still fails
      leaves fewer bytes than the release says, so the unpack refuses it as incomplete: a message, nothing installed,
      either way.
    mutants:
      - taskloom.editor.window.xǁUpdateDownloadǁ_downloaded__mutmut_2
      - taskloom.editor.window.xǁUpdateDownloadǁ_downloaded__mutmut_3
  - kind: The .partial-* folder removed with its errors raised
    why: >-
      Taskloom made the folder and closed every file it wrote there; nothing else opens it, so its removal does not
      fail and there is no error to raise.
    mutants:
      - taskloom.editor.window.xǁUpdateDownloadǁ_end__mutmut_2
      - taskloom.editor.window.xǁUpdateDownloadǁ_end__mutmut_4
      - taskloom.editor.window.xǁUpdateDownloadǁ_end__mutmut_5
  - kind: The name of an entry's temporary file
    why: >-
      An entry is written as <entry>.new, then renamed over the entry at once: under any name, the entry is the same
      and the temporary file is gone.
    mutants:
      - taskloom.entries.x__write__mutmut_4
      - taskloom.entries.x__write__mutmut_5
  - kind: An entry that starts an older version at the cleanup
    why: >-
      At each start entries.follow, just before the cleanup, points each entry that starts an older version at this
      one; so no entry starts a folder the cleanup could remove, and the folders kept for the entries are the same
      whichever part of the shortcut is read.
    mutants:
      - taskloom.update.x_clean_up__mutmut_10
  - kind: No Startup script, as a text no folder is part of
    why: >-
      With no Startup script the cleanup looks for each folder in "" or in "XXXX": a folder's path, ending in a
      separator, is part of neither, so the same folders are kept and removed.
    mutants:
      - taskloom.update.x_clean_up__mutmut_37
