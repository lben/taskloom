# How each agreed row of docs/promises/credentials.yaml is kept, and why a row is not green (read by
# packaging/ledger.py; the reviewer checks these words against the code). Credentials have no model to check: their
# rows are amber, checked by tests only (tests/test_credentials_*.py, every one with the tests' stand-in store,
# tests/credential_store), and not_green says what the tests leave out.
CR-1:
  enforced: >-
    Tools > Credentials… (MainWindow.edit_credentials, taskloom/editor/window.py) opens CredentialsDialog
    (taskloom/editor/credentials_window.py): the cards on the left (Add…, Rename…, Delete), the chosen card's rows on
    the right (CredentialsDialog._show_rows, one RowLine each and always one empty row last). Every change stays in
    the window until CredentialsDialog._save, which hands them all to credentials.save: the values first, then the
    list file, and if a step fails the values already changed are put back (credentials._write) and the window stays
    open. Cancel closes it with nothing stored.
  not_green: >-
    Tests add, rename and delete cards and rows, Save and Cancel, and make the store refuse midway through a Save;
    no check tries every order of changes in one opening of the window.
CR-2:
  enforced: >-
    ValueBox.show_value (taskloom/editor/credentials_window.py) shows every value, also while it is typed, as the same
    DOTS (12) whatever its length; the eye of a row (CredentialsDialog.toggle_eye) shows that row's value alone and
    dots again when pressed again; a window made anew (each opening) starts with every eye closed.
  not_green: >-
    Tests compare the dots of values of 19, 11, 14 and 3 characters, open one row's eye while another row's value is
    typed, press it again, and open the window again after an eye was left open; what a screen reader or a copy from
    the field gives is not checked.
CR-3:
  enforced: >-
    credentials.holder follows a row's pointer, or the card a card takes its values from, to the row that holds the
    value, the card's own row first, keeping what it has passed: a card or row met again is a circle, raised as
    CredentialError ("Circle in credentials: A -> B -> A") at once, so a run stops naming it (credentials.value). In the
    window, "Takes its values from" (CredentialsDialog._uses_chosen) and Point at another row… (CredentialsDialog._point)
    are refused with a message when credentials.circle finds one; deleting what another uses is refused naming who
    (credentials.users).
  not_green: >-
    Tests follow chains of two cards and of two pointers, make circles of two cards and of two rows in the window and
    in stored data, and run flows that meet one (each ends within a minute); chains of every length are not tried.
CR-4:
  enforced: >-
    A whole field secret:CARD.key gets its value from Home.get_secret (taskloom/config.py): a connection's through
    Home.resolve_secrets, an API Request header's as it is sent (servers.py, _row_headers); params.render fills {{secret:CARD.key}} in every text that takes placeholders through
    Home.get_secret (engine._fill); PythonCode.run gives the code secret("CARD.key") for each name
    logic._secret_calls finds written as text. ConnectionsDialog._credential_chosen (taskloom/editor/dialogs.py) makes
    a connection name secret:CARD.key of a row chosen in its list (credentials.references), storing nothing.
    API Request's and Ask User's Stored secret take CARD.key; Import from cURL's Fill in
    (PropertiesPanel._fill_from_curl, taskloom/editor/panels.py) stores each secret as the row typed
    (credentials.store) and the block names it.
  not_green: >-
    Tests send each form's value to a local web server and check what arrives, pick a row in the Connections window
    and test the connection, and Fill in a cURL command; not every setting of every block is tried.
CR-5:
  enforced: >-
    Home.get_secret adds every value read to REVEALED, and engine.redact replaces each of its forms (engine.forms_of:
    as it is, as Python and JSON write it inside quotes, URL-encoded) with *** in what a run logs, raises and records:
    the Log, Run history and the history database (run_flow records redact(values)), the failure email and the
    scheduler's messages (Scheduler.__init__). What code below print writes, and what a program it starts prints, goes
    through a pipe whose whole lines are redacted (cli._hide_below_print, _Relay; _Hiding for print and logging).
    Kept tables have their cells rewritten (engine._scrub_tables); outputs holding a value are not kept
    (_Runner._keep_outputs); the Python environment's outputs are masked on their way back (pyenv.masked); the editor's
    crash log, terminal and error box show redact's text (Safety.install_crash_log). The flow file and its commits
    hold only references.
  not_green: >-
    Tests look for the value, and its URL-encoded form, in each place the row names; a value of fewer than 4
    characters is not hidden (CR-6). What a program a block starts prints after the run has ended may be lost, and the
    Windows console may show other alphabets garbled (not checked on Windows' console). A value is hidden only once
    this process has read it: one typed by hand that equals a stored secret is not.
CR-6:
  enforced: >-
    RowLine.refresh (taskloom/editor/credentials_window.py) shows "Too short to hide in the Log: use 4 or more
    characters" on a row whose value, also an empty one, is shorter than SHORT (4), the length engine.forms_of starts
    hiding at.
  not_green: >-
    Tests store values of none, 3, 4 and more characters, and type values that become shorter and longer; not every
    length is tried.
CR-7:
  enforced: >-
    credentials._put and credentials._get keep each value in keyring under the service taskloom-cards (Windows
    Credential Manager, macOS Keychain); credentials.save writes <home>/credentials.yaml with cards, uses and keys
    (a pointer as CARD.key), never a value. Nothing reads the service taskloom of earlier versions;
    docs/release-notes.md (0.42.0) and the guide say how to enter those secrets again and remove the old entries.
  not_green: >-
    Tests read the list file and the stand-in store after every change, and that a value stored under the earlier
    service is never read; the real macOS Keychain is not tried (the real Windows store is, on CI only).
CR-8:
  enforced: >-
    validate (taskloom/flow.py) collects every reference a block makes (its texts through flow._references, its own
    fields through each block's references, the connection it uses through flow._secret_refs) and names each one
    credentials.holder cannot find, with its block and setting. run_flow calls it with values=True before the first
    block, so a missing stored value (Home.get_secret) stops the run too, naming every one.
  not_green: >-
    Tests leave out cards, keys and stored values that one flow names in every kind of place, and that a connection a
    block uses names; not every setting of every block.
CR-9:
  enforced: >-
    cmd_secret_list (taskloom/cli.py) prints credentials.listing, which has cards, uses, keys, pointers and "no value
    stored", never a value. cmd_secret_set refuses a value on the command line (exit 2) and reads it from a hidden
    prompt (getpass) or, with --stdin, from standard input. cmd_secret_delete removes a row or a card through
    credentials.remove; a name that is not there gives exit 1 naming it.
  not_green: >-
    Tests run each command as a program; the hidden prompt is tried with no terminal of its own (getpass then reads
    standard input), not in a real terminal.
CR-10:
  enforced: >-
    logic._secret_calls reads the code's syntax tree: each secret() call whose argument is one text gives its name;
    any other argument is a problem naming the block, which PythonCode.problems gives Validate. The names go to the
    code in both ways of running it: in Taskloom's own Python (PythonCode._run_here) and in your Python environment
    through the job sent on its standard input (pyenv.run_code).
  not_green: >-
    Tests try a name not written as text in both ways of running Python (Validate names the block, the code never
    runs), and the same code with the name written as text; not every expression.
CR-11:
  enforced: >-
    params.render fills each placeholder of the text once, from the text as written: a value put in is never read
    again, so braces inside it stay as they are.
  not_green: >-
    Tests put {{day}} (a flow parameter) and {{secret:UAT.host}} inside a value sent in a text body, an HTML
    Template's email and a whole-field header; not every text that takes placeholders.
CR-12:
  enforced: >-
    credentials.remove (the command) and credentials.save with a value None (the window's Delete) remove every part of
    the value from the store (credentials._put) along with the row or card.
  not_green: >-
    Tests delete rows and cards with the command and in the window, one of them a value of 5,000 characters in parts,
    and look into the stand-in store; the real macOS Keychain is not tried.
CR-13:
  enforced: >-
    credentials._store raises CredentialError on Windows and macOS when keyring has no usable store, and
    credentials._asking_the_store turns what a store raises into one, so nothing is stored or read from a file there
    and the window, Save in the Connections window and Fill in say why (QMessageBox). On Linux with no store,
    credentials._file_values and _file_write keep the private secrets.yaml as before.
  not_green: >-
    Tests make the stand-in store locked, or keyring's fail backend, on a PC (the commands, a run, the window, the
    Connections window and Fill in), and leave none on Linux; a real store that fails is not tried.
CR-14:
  enforced: >-
    credentials.check_name allows letters of any alphabet, digits, _ and -, and refuses a dot, a space or an empty
    name, saying why; credentials._find compares names with casefold, so uat.PASSWORD finds UAT.password and a second
    name differing only in case is refused, in the commands and in the window (CredentialsDialog._name_problem).
  not_green: >-
    Tests try names of 1 and 100 characters, Zürich_Ключ-1 and пароль, a dot, a space, an empty name and names in
    other case; not every character.
CR-15:
  enforced: >-
    credentials.listing and the window's rows (RowLine.refresh through credentials.stored) show "no value stored" for
    a listed key whose value is not in the store; credentials.value raises CredentialError naming it, which stops a
    run (CR-8). A stored value that is not listed is never found, and setting its row replaces it.
  not_green: >-
    Tests remove a value from the stand-in store behind the list, and store one that is not listed; not every way
    the two could disagree.
CR-16:
  enforced: >-
    CredentialsDialog._ask_open_flows names the open flows and blocks that use a card or key being renamed and asks:
    Rename only, or Also rewrite the open flows. flow.renamed_credentials (through params.renamed) gives each flow
    rewritten; MainWindow.edit_credentials applies it on Save as one unsaved change in each open flow, which one Undo
    takes back. Flows not open are not touched; validate names their old references (CR-8).
  not_green: >-
    Tests rename a card (rewriting the open flows, Undo taking it back) and a key (rename only, Validate naming the
    old references), and choose rewrite then Cancel; not every kind of setting is rewritten.
CR-17:
  enforced: >-
    credentials._put stores a value of more than PART (500) characters in several entries and _get joins them back;
    removing it removes every part.
  not_green: >-
    Tests store 5,000 characters in a stand-in store with Windows' size limit; the real Windows store is tried on CI
    only (test_the_real_windows_credential_store_takes_a_long_value_names_in_other_case_and_deletes_it_whole), and
    macOS's not at all.
CR-18:
  enforced: >-
    params.parse reads {{secret:CARD.key}} as the name SECRET with its reference, never a parameter; validate refuses a
    flow parameter or an input named secret.
  not_green: >-
    Tests name a parameter and an input secret; not every spelling of a placeholder.
CR-19:
  enforced: >-
    validate warns, for a reference in an SSH Command's or a Start Remote Process's command (flow.COMMANDS), that
    other programs on that machine can see a command while it runs; the command's output is redacted as any (CR-5).
  not_green: >-
    Tests check the warning for both blocks and none for a command without a secret, the value reaching an SSH
    command's server with *** in the Log, and the Log of a Start Remote Process command that fails printing it.

# The checker of this feature: mutation testing of the functions the change touched, which are the scope in
# credentials.mutants.yaml. CI runs it in the checkers-features job (.github/workflows/build.yml).
checkers:
  - name: Mutation testing
    kind: mutation
    command: python packaging/mutants.py . --run --explained docs/promises/credentials.mutants.yaml --out {out}/mutants.json
    key: '^(PASSED|FAILED): mutation score'
