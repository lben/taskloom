# The bugs proving a re-run seen by the blocks after it found, each fixed and guarded by a test since (the proof PDF
# counts and lists them before the details; tests/test_promises_found.py checks each test exists), and where it is
# checked more lightly.
found:
  - what: A request in a Session, run alone after the login before it was run alone, kept sending the cookie of the earlier login.
    found_by: the test writer
    fixed_in: e787ca7
    guarded_by: tests/test_rerun_old_and_kept.py::test_a_request_in_a_session_rerun_alone_sends_the_cookie_the_request_before_it_got_when_it_was_rerun_alone
  - what: After a Merger set to each line was run alone, the block after its lines' runs could not run alone ("report did not run in run #2").
    found_by: the test writer
    fixed_in: e787ca7
    guarded_by: tests/test_rerun_old_and_kept.py::test_after_a_merger_of_each_line_is_rerun_alone_the_blocks_after_its_runs_rerun_alone_get_every_lines_result
  - what: After a full run that ended before reaching a block (Stop, or its process died), that block run again took the earlier run's inputs without a word, e.g. the 10 rows of run #1 although load_orders gave 12 in run #2.
    found_by: the implementer's own review, confirmed by a test
    fixed_in: e787ca7
    guarded_by: tests/test_rerun_stopped_and_cleaned.py::test_after_a_full_run_that_ended_before_a_block_that_block_rerun_alone_gets_what_the_run_made_before_it
  - what: With Keep runs set to keep the last run only, a block whose own run was let go named a run that no longer exists, and running it again was refused.
    found_by: the test writer
    fixed_in: e787ca7
    guarded_by: tests/test_rerun_stopped_and_cleaned.py::test_with_the_run_of_a_blocks_own_result_let_go_by_keep_runs_the_rerun_that_carried_on_from_it_is_named_and_used
  - what: 'A refusal because a block before did not run said it twice: "run the whole flow instead: run the whole flow instead, or choose its inputs".'
    found_by: the test writer
    fixed_in: e787ca7
    guarded_by: tests/test_rerun_mutants.py::test_a_block_refused_because_the_block_before_it_did_not_run_is_told_to_run_the_whole_flow_instead_once
  - what: A re-run that died while its block ran, or was stopped before the block began, left the block's earlier output as current, so the block after it ran on it without a word.
    found_by: the reviewer
    fixed_in: c85b2f5
    guarded_by: tests/test_rerun_died.py::test_after_a_rerun_of_a_block_alone_died_while_the_block_ran_the_block_after_it_is_refused_naming_that_block
lighter:
  - "The old marks' grey is judged from pictures of the canvas in the Fusion style only, not in Windows' own style."
  - "A re-run made from a run opened in Run history starts a chain of its own: a later result made that way is not marked old."
  - "The old marks are worked out when results arrive, not again when a connection is edited."
