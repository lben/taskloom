# Mutation testing of Validate's status bar and the Documentation column's width (read by packaging/mutants.py
# --explained). scope: what the bugs are planted in, the two functions the change touched, each whole (its lines from
# before as well as the changed one), in groups: each group's bugs run the tests that can see them (each line of
# tests: is one pytest run, of a file or several, with -k words or without). MainWindow._ready_to_run's run the tests
# of Validate, Run, Run only and Run from: the box of problems (from the flow, from how its file is written, from
# connections.yaml; one per line, at most 12, over the window), the Log brought to the front with each problem and
# warning and its time whichever block it shows, a new flow saved first, and Run only and Run from checking just the
# blocks they run. The change's other line is not in a function of the package, so nothing is planted in it: the
# README proof's copy of the column's style (tests/proofs/test_proof_readme.py). The mutants the tests let through
# are explained here, by kind (kinds: a kind, its why, the mutants it explains) or one by one (mutant name: why it
# changes nothing a user could notice). Only those no user could notice are explained: the others stay without a
# reason until a test catches them. DocsBrowser.__init__'s mutmut_5 (the style's rule for `code` lost) is one: on
# macOS inline code and the guide's code boxes then take the system's fixed font (Menlo), the reference pages' examples
# still "monospace"; the tests' offscreen platform gives `code` that same "monospace" itself, so no test here sees it.
scope:
  mutate:
    - mutate:
        - taskloom/editor/window.py DocsBrowser.__init__
      tests:
        - tests/test_docs_help.py -k "no_page_scrolls_sideways or https_link_opens_in_the_system_browser"
        - tests/test_zoom_panes.py -k "grow_the_pane and docs"
    - mutate:
        - taskloom/editor/window.py MainWindow._ready_to_run
      tests:
        - tests/test_paths_editor_editing.py tests/test_paths_editor_running.py tests/test_run_scope.py -k "finds_problems or cancelling_that_runs_nothing or editor_run_run_only_and_run_from or editor_validate_lists_every_problem or new_flow_you_have_not_changed or run_from_stop_at"
kinds:
  - kind: Another name for the column's zoom
    why: >-
      The name the Documentation column's zoom is saved under in editor.ini: no other pane and no doc uses it, so the
      column keeps its size the same way under any name.
    mutants:
      - taskloom.editor.window.xǁDocsBrowserǁ__init____mutmut_11
      - taskloom.editor.window.xǁDocsBrowserǁ__init____mutmut_12
