# The design decisions of credentials on the PC, one line each (read by packaging/proof_pdf.py): what was chosen, and
# when to look at it again.
- chosen: 'Two places, never mixed: <Taskloom home>/credentials.yaml lists the cards, what each takes its values from and its keys (a pointer names the row it points at), never a value; each value is in the operating system''s credential store (keyring, service taskloom-cards), one entry per row under CARD.key, read and written only by credentials.py.'
  revisit_if: the credential store can list its entries itself, so the list file could be made from it.
- chosen: One resolver (credentials.holder) follows a row's pointer, or the card a card takes its values from, to the end, with a record of what it has passed, so a circle stops it at once with "Circle in credentials" naming the cards; the card's own row for a key wins over the card it takes from.
  revisit_if: a card must take its values from more than one card.
- chosen: Names are letters of any language, digits, _ and -, compared without regard to case (the Windows store does not tell UAT from uat); the spelling in the list is the one shown and stored.
  revisit_if: Taskloom runs only where the store tells upper from lower case, and someone needs UAT and uat apart.
- chosen: A value over 500 characters is stored in several entries (a Windows entry holds 1,280 UTF-16 units; 500 characters are at most 1,000) and read back and deleted whole; how they are named is credentials.py's own.
  revisit_if: Windows' limit changes, or every store in use holds a value of any length.
- chosen: 'On Windows and macOS a store that cannot be used is said, with its reason, and nothing is stored; on Linux the private file secrets.yaml stays until stage 6, as before. What counts is the operating system, not a setting (your answer of 26 November, 8).'
  revisit_if: stage 6 gives servers a store of their own, or a PC must run without a working store.
- chosen: Secrets stored before this version (under the service taskloom) are never read; the release notes and the guide say how to enter them again as rows and remove the old entries (your answer of 26 November, 1). No migration code.
  revisit_if: flows in use need many earlier secrets, so entering them again by hand costs more than a one-off import.
- chosen: 'Three ways to name a value, one rule each: secret:CARD.key as a whole field (connections, API headers), {{secret:CARD.key}} inside any text that takes placeholders, always a reference (a parameter or input named secret is refused: answer 7), and secret("CARD.key") in Python Code with the name written as text, so Validate and the run know what the code needs before it runs.'
  revisit_if: code must choose a credential while it runs, e.g. from a list of cards, which a name written as text cannot do.
- chosen: Every value a process reads is replaced by *** in all it tells, as it is, as Python and JSON write it inside quotes and URL-encoded (engine.forms_of, engine.redact); a value under 4 characters is not hidden, since it would hide parts of ordinary words, and the window says so on its row.
  revisit_if: a value must be hidden that the process never read, e.g. one typed by hand that happens to equal a stored secret.
- chosen: A run checks every reference its blocks and connections make before its first block, and stops naming all that are missing (answer 6); Validate names each with its block and setting.
  revisit_if: a flow must run while a branch it will not take names a missing credential.
- chosen: In Python Code the values go to your Python environment through the job sent on its standard input, never in an environment variable, an argument or a file; the outputs it writes back are masked with a key only the job carries.
  revisit_if: the Python environment runs on another machine, where standard input is not private.
- chosen: The window keeps every change until Save, which stores the values and then writes the list, all or nothing (what was written is put back if a step fails); Cancel stores nothing; a Save after the list was written elsewhere since the window opened is refused.
  revisit_if: two people must change the same cards at the same time.
- chosen: Every value shows as the same 12 dots whatever its length; a row's eye shows that one value until pressed again, and the window opened again shows dots.
  revisit_if: people need to tell values apart without opening the eye, e.g. by their last characters.
- chosen: 'Renaming a card or key that open flows use asks: rename only, or also rewrite the open flows (your answer of 26 November, 2); the rewrite is made on Save, in each open flow as one unsaved change that one Undo takes back. Flows that are not open are never changed; Validate names their old references.'
  revisit_if: flows that are not open should follow a rename too.
- chosen: The Connections window offers, beside a connection's password, token or key, a list of every row of the cards as CARD.key; choosing one names it secret:CARD.key and stores nothing. A value typed there instead is stored as before.
  revisit_if: a connection needs a credential from a card chosen at run time, e.g. one card per environment.
- chosen: A secret may be written in an SSH Command's or a Start Remote Process's command; Validate warns that other programs on that machine can see a command while it runs, and the Log shows *** (answer 9).
  revisit_if: those blocks get a way to send a value on standard input instead of in the command.
- chosen: Tests never touch the real store. Every test, and every program a test starts, uses a stand-in store (tests/credential_store) chosen through keyring's own setting, with modes that act as Windows' store does (one name whatever the case, a size limit) and as one that cannot be used; one test of the real Windows store runs on CI only (answer 5).
  revisit_if: a real store behaves in a way the stand-in does not copy, as found by the real-store test or a bug report.
