# The design decisions of Local and Global reusable blocks, one line each (read by packaging/proof_pdf.py): what was
# chosen, and when to look at it again.
- chosen: 'A Local block''s definition lives in the flow file, under local_blocks: its title, what it does, what its inputs expect and the Python Code settings it runs with (inputs, outputs, Run in my Python environment, code). Its copies are blocks of type local.<name> with no settings of their own, so every copy runs the same code.'
  revisit_if: copies must differ in a setting other than what is connected or typed into their inputs, which would need settings of each copy's own.
- chosen: 'Create reusable block…, Local, turns the source block into the first copy (your answer of 24 November, a): its name, place, lines and typed values stay, and no second block with the same code is left to drift apart.'
  revisit_if: the source must stay a plain Python Code block, e.g. to keep trying changes on it while the copies run the saved code.
- chosen: One function (registry.for_flow) makes a flow's block types, those of your blocks folder plus one block per definition made by the Python Code block; the engine, Validate, Check flows and taskloom run each call it themselves, and the editor makes it again whenever the flow's definitions or your blocks folder change.
  revisit_if: making it again on every change gets slow (a flow with very many definitions), or Local blocks of other kinds than Python Code are wanted.
- chosen: A definition with a problem is not made into a block; Validate says its problem once, naming its copies, and does not check those copies one by one. A copy whose definition is missing is named as such.
  revisit_if: a definition's problem should still let the copies' other problems be seen, e.g. their connections.
- chosen: 'A pasted definition joins this flow''s Local block of the same name when the two have the same code (the same inputs, outputs, Run in my Python environment and code), the flow''s own title and texts kept; one with other code, or whose name or title a Global block has, is kept as <name>_2 (the first free of _2, _3, …) titled "<title> 2", and the status bar says so (your answer of 24 November: keep both).'
  revisit_if: a pasted copy should bring its own title and texts when it joins, or you want to choose at each paste.
- chosen: Removing an input of a definition while copies have a line or a typed value on it is refused, naming each such copy and what it has there (your answer of 24 November, a); renaming an input or output moves every copy's lines and typed values with it.
  revisit_if: removing an input should clear what the copies had on it, with a warning, instead of asking you to clear it first.
- chosen: Promote to global reusable block asks first, because undo cannot remove the file it writes (your answer of 24 November, a); undo makes the copies Local again and leaves the file and the block in the tree.
  revisit_if: undo can remove files too, e.g. the blocks folder gets a history of its own.
- chosen: A definition goes with its last copy, in the same undo step, and the flow file never keeps a definition no copy uses.
  revisit_if: a definition should be kept with no copy, e.g. a flow used as a library of Local blocks.
- chosen: 'A Local and a Global block may not share a name: Create reusable block and Promote check the name against your blocks folder and this flow''s Local blocks, and a pasted definition is renamed. A Global block made later with a Local block''s name or title (from another flow, or as a file) is not refused then; the flow that has both is refused by Validate and by every run, naming both, until one is renamed.'
  revisit_if: making the Global block should be refused already, which would need every flow's Local blocks to be known when it is made.
- chosen: '"Shared by N blocks: an edit changes all N" shows in Properties when two or more copies share the definition, between their Outputs and Code, as in the approved picture; one copy alone shows none.'
  revisit_if: the note should also say that a single copy's code lives in the flow file and not in the block.
