\* Trace validation (TraceSchedulerService.tla): the model's bounds and design switches as in SchedulerService.cfg.
\* Flows are the strings the traces name them by, so no SYMMETRY. "Invariant TraceIncomplete is violated" means
\* the trace matches (see the module's comment).
SPECIFICATION TraceSpec
CONSTANTS
    Flows = {"f1", "f2"}
    MaxTime = 2
    MaxLives = 2
    Limit = 1
    MaxManual = 1
    MaxChanges = 1
    MaxTurnOffs = 1
    MaxKills = 1
    Overlaps = {"skip", "queue"}
    Misfires = {"skip", "catch_up"}
    ClaimChecksOverlap = TRUE
    TermOnTurnOff = TRUE
    ProceedDropsStop = TRUE
    EditorStartsSchedule = TRUE
CHECK_DEADLOCK FALSE
INVARIANT TraceIncomplete
