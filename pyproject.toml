[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskloom"
dynamic = ["version"]
description = "Build automations by dragging and connecting blocks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Benito Leon" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "holidays>=0.50",
    "JPype1>=1.5",
    "keyring>=24",
    "markdown-it-py>=3",
    "fastexcel>=0.10",
    "xlsxwriter>=3.1",
    "tzdata; sys_platform == 'win32'",
    "pyside6>=6.7",
    "paramiko>=3.4",
    "matplotlib>=3.8",
    "css-inline>=0.14",
    "rich>=13",
    "dulwich==1.2.20",
    "mmdr==0.4.0",
]

[tool.hatch.version]
path = "taskloom/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "taskloom/README.md"  # the guide of Help > Documentation

[project.scripts]
taskloom = "taskloom.cli:run_cli"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "asyncssh>=2.24.1",
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    "pyflakes>=4.0.3",
    "pyinstaller>=6.10",
    "pytest>=8",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "charter(rule): a test that checks a rule of the architecture charter (docs/ARCHITECTURE.md), e.g. C6",
    "invariant(row): a test that checks an agreed must-always-be-true row (docs/promises/), e.g. SCH-4",
]

# Mutation testing of the scheduler feature (`mutmut run`, then packaging/mutants.py with
# docs/promises/scheduler.mutants.yaml). Each mutant runs, in a process forked from mutmut's, the selected tests that
# reach its function, and nearly every scheduler test reaches the schedule code and the service's check. So the
# selection is the scheduler tests that run in this process within about a second: those that start real processes,
# wait in real time or run many generated cases are left out (the whole suite still runs them), and so are those that
# start Qt (a process forked after Qt has started can hang or crash). Every line is mutated: mutate_only_covered_lines
# would leave out what the selection does not run, but mutmut ignores a test that fails while it measures that, so a
# flaky test would silently shrink what is checked.
[tool.mutmut]
source_paths = ["taskloom/"]
only_mutate = ["taskloom/schedule.py", "taskloom/scheduler.py"]
also_copy = ["README.md"]  # (tests check the README's words)
process_isolation = "fork"
timeout_multiplier = 2.0
timeout_constant = 10.0
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/test_schedule_times.py", "tests/test_scheduler.py", "tests/test_interval_schedules.py",
    "tests/test_scheduler_at_its_time.py", "tests/test_scheduler_held_times.py", "tests/test_scheduler_manual_runs.py",
    "tests/test_scheduler_mistakes_and_counts.py", "tests/test_scheduler_model_fixes.py",
    "tests/test_scheduler_new_promises.py", "tests/test_scheduler_while_off.py",
    "tests/test_scheduler_service_calls.py", "tests/test_scheduler_trace_findings.py",
    "tests/test_keeper_lock.py",
    "tests/test_scheduler_mutants_starts.py",
    "tests/test_scheduler_mutants_ends.py",
    "tests/test_scheduler_mutants_state.py",
    "tests/test_scheduler_mutants_times.py",
    "tests/test_scheduler_ci_findings.py",
    # (from files whose other tests are slow)
    "tests/test_scheduler_promises.py::test_an_every_n_schedule_has_its_times_every_n_from_when_first_seen_through_2028",
    "tests/test_scheduler_promises.py::test_skip_still_runs_a_time_less_than_2_minutes_late",
    "tests/test_scheduler_promises.py::test_a_crashed_run_is_emailed_about_only_when_its_flow_asks_for_failure_emails",
    "tests/test_scheduler_on_time.py::test_a_one_off_time_missed_while_the_scheduler_was_off",
    "tests/test_scheduler_on_time.py::test_a_paused_schedule_block_never_starts_a_run",
    "tests/test_scheduler_on_time.py::test_an_edited_schedule_starts_from_now",
    "tests/test_scheduler_on_time.py::test_one_catch_up_time_while_a_run_is_going_still_follows_overlap_skip",
    "tests/test_scheduler_on_time.py::test_the_scheduler_waits_until_the_next_due_time_and_at_most_a_second",
    "tests/test_paths_scheduler.py::test_a_mistake_in_settings_does_not_stop_the_keeper_for_good",
    "tests/test_paths_scheduler.py::test_a_run_that_prints_bytes_that_are_not_text_is_still_reported_as_it_ended",
    "tests/test_paths_scheduler.py::test_a_schedule_turned_back_on_counts_from_that_moment",
    "tests/test_paths_scheduler.py::test_a_scheduled_run_that_fails_is_told_once_on_the_desktop_and_emailed_once",
    "tests/test_paths_scheduler.py::test_a_scheduled_yaml_taskloom_cannot_read_is_told_and_the_service_goes_on",
    "tests/test_paths_scheduler.py::test_a_server_the_keeper_cannot_check_is_told_clearly",
    "tests/test_paths_scheduler.py::test_the_keeper_leaves_a_server_scheduler_that_is_running_alone",
    "tests/test_paths_scheduler.py::test_the_keeper_starts_a_server_scheduler_that_is_hung_or_gone",
    "tests/test_paths_scheduler.py::test_the_keeper_replaces_a_hung_server_scheduler_or_says_it_could_not",
    "tests/test_paths_scheduler.py::test_the_keeper_checks_and_starts_the_scheduler_of_the_taskloom_folder_set_for_the_server",
    "tests/test_paths_scheduler.py::test_the_keeper_does_not_say_it_started_a_server_scheduler_whose_command_does_not_exist",
    "tests/test_triggers.py::test_scheduler_runs_the_schedule_block_branch",
    "tests/test_scheduler_stops_and_sleeps.py::test_when_the_service_stops_with_runs_going_it_counts_only_the_runs_that_have_begun",
    "tests/test_scheduler_question_dropped.py::test_an_answer_to_a_question_whose_missed_runs_were_dropped_is_applied_to_nothing",
    "-k", """not (tray or editor or countdown or when_builders or stays_a_custom or while_the_service_is_off \
        or saving_a_flow or clicking_run or stops_the_flows_runs_and_drops or process_is_gone or real_service \
        or headless or saved_while_the_service_is_on or keeps_the_starting_point or misfire_policy or on_time_runs \
        or its_time_and_still_loading or half_written or overlap_skip_a_time or server_service_with \
        or refuses_to_start or process_is_killed or time_zone_changes or turn_off_asked_for)""",
]
