[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskloom"
dynamic = ["version"]
description = "Build automations by dragging and connecting blocks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Benito Leon" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "holidays>=0.50",
    "JPype1>=1.5",
    "keyring>=24",
    "fastexcel>=0.10",
    "xlsxwriter>=3.1",
    "tzdata; sys_platform == 'win32'",
    "pyside6>=6.7",
    "paramiko>=3.4",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "css-inline>=0.14",
]

[tool.hatch.version]
path = "taskloom/__init__.py"

[project.scripts]
taskloom = "taskloom.cli:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "asyncssh>=2.24.1",
    "pyflakes>=4.0.3",
    "pyinstaller>=6.10",
    "pytest>=8",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
