name: test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
  H2_URL: https://repo1.maven.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - run: uv run pyflakes taskloom tests packaging
      - run: uv run pytest -q --ignore=tests/proofs  # the proofs run in the proof jobs
        env:  # which agreed row or charter rule each test checks, and how every test ended: for the proof's ledger
          TASKLOOM_LEDGER: ${{ github.workspace }}/results-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a test failed: the ledger shows which row it breaks
        with: {name: "test-results-${{ runner.os }}", path: "results-${{ runner.os }}.json"}

  # The checkers of the scheduler feature (docs/promises/scheduler.evidence.yaml): each one's whole output and result
  # go to proof/, which the proof job turns into the feature's pages. A GitHub job runs at most 6 hours, so they run in
  # parallel jobs: the model check alone (about 2 h 10 min; 1 h 24 min on a 10-core laptop with 4 workers); the trace
  # validation, the leak check and design health together (about 20 min); mutation testing in 3 parts, in the mutation
  # job. The evidence job puts their results together.
  checkers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: model
            only: '--only "TLA+ model check"'
          - group: trace-leak-design
            only: '--only "TLA+ trace validation" --only "Leak check" --only "Design health"'
    runs-on: ubuntu-latest
    timeout-minutes: 330  # (packaging/checkers.py stops a checker after 5 hours, so its log is kept)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: TLA+ tools 1.7.4 (TLC, for the model check and trace validation), where packaging/tla_trace.py looks
        env: {GH_TOKEN: "${{ github.token }}"}  # (signed in: an anonymous download can be refused)
        run: |
          jar="$HOME/.local/share/tlaplus/1.7.4/tla2tools.jar"
          mkdir -p "$(dirname "$jar")"
          for try in 1 2 3 4 5; do
            gh release download v1.7.4 -R tlaplus/tlaplus -p tla2tools.jar -O "$jar" --clobber && break
            echo "download $try failed; trying again in 20 s"; sleep 20
          done
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - run: uv run python packaging/checkers.py docs/promises/scheduler.yaml proof ${{ matrix.only }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a checker failed: the proof shows its output
        with:
          name: checkers-${{ matrix.group }}
          path: |
            proof
            !proof/**/tlc-states

  # Mutation testing of the scheduler in 3 parts at once, each every 3rd mutant that counts (packaging/mutants.py
  # --part; about 2 h 15 min each, 3.8 h for all on a 10-core laptop with 4 workers). The evidence job scores them.
  mutation:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - name: Mutation testing, part ${{ matrix.part }} of 3 (its whole output goes to proof/scheduler/logs)
        run: |
          set -o pipefail
          mkdir -p proof/scheduler/logs
          uv run python packaging/mutants.py . --run --part ${{ matrix.part }}/3 \
            --explained docs/promises/scheduler.mutants.yaml 2>&1 \
            | tee proof/scheduler/logs/mutation-part-${{ matrix.part }}.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when it failed: the evidence job says which mutants have no verdict
        with:
          name: mutation-part-${{ matrix.part }}
          path: |
            mutants
            proof
            !mutants/**/__pycache__

  # The checkers' results together, where the proof job reads them (proof-evidence: proof/scheduler/ with
  # checkers.json, every checker in its listed order, their logs, mutants.json and leak.json): mutation testing's
  # parts scored as one run, then every job's results merged (packaging/checkers.py --merge).
  evidence:
    needs: [checkers, mutation]
    if: ${{ !cancelled() }}  # also when a checker failed or ran out of time: the proof shows which
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - uses: actions/download-artifact@v4
        with: {pattern: "checkers-*", path: jobs}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {pattern: "mutation-part-*", path: mutation-parts}
      - name: Mutation testing, its parts scored as one run
        if: ${{ !cancelled() }}
        run: |
          uv run python packaging/checkers.py docs/promises/scheduler.yaml jobs/mutation --only "Mutation testing" \
            --command "python packaging/mutants.py . --parts mutation-parts/* --explained docs/promises/scheduler.mutants.yaml --out {out}/mutants.json"
      - name: Every checker's result, in proof/
        if: ${{ !cancelled() }}
        run: uv run python packaging/checkers.py docs/promises/scheduler.yaml proof --merge jobs/* mutation-parts/*/proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-evidence, path: proof}

  # The proofs Windows cannot show (marked linux_proof, each saying why), on Linux: the proof job puts them in its PDF.
  proof-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries, and fonts for the screenshots (DejaVu, found through fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q -m linux_proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        with: {name: proof-records-linux, path: "${{ env.PROOF_DIR }}"}

  # The proof: each feature and fix shown working in the app, on Windows (or on Linux, by the proof-linux job, those
  # Windows cannot show), as one PDF of screenshots and checks.
  proof:
    needs: [proof-linux, test, evidence]
    if: ${{ !cancelled() }}  # also when a Linux proof, a test or a checker failed: the PDF shows what failed
    runs-on: windows-latest
    timeout-minutes: 45  # the proofs alone take about 28 minutes on Windows
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # the history and tags: the PDF says which changes are new since the last release
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-records-linux, path: proofs-linux}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {pattern: "test-results-*", path: results, merge-multiple: true}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-evidence, path: proof}
      - name: Evidence ledger, C4 view and release-wide numbers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # A feature is its agreed list, <feature>.yaml; its other files are <feature>.<kind>.yaml.
          for promises in docs/promises/*.yaml; do
            case "$promises" in *.*.yaml) continue;; esac
            stem=$(basename "$promises" .yaml)
            mkdir -p "proof/$stem"
            uv run python packaging/ledger.py "$promises" results/*.json --checkers "proof/$stem/checkers.json" \
              --out "proof/$stem/ledger.json" || status=1
          done
          uv run python packaging/c4.py proof/c4
          uv run python packaging/release_evidence.py proof results/*.json
          exit ${status:-0}
      - name: Proof PDF
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        shell: bash
        run: |
          features=(); for promises in docs/promises/*.yaml; do
            case "$promises" in *.*.yaml) continue;; esac
            features+=(--feature "$promises")
          done
          uv run python packaging/proof_pdf.py "$PROOF_DIR" proofs-linux "Taskloom-proof-${GITHUB_REF_NAME//\//-}.pdf" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${features[@]}" --evidence proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: taskloom-proof, path: Taskloom-proof-*.pdf}
      - name: The evidence behind the PDF (each checker's whole log), for the release
        if: ${{ !cancelled() }}
        shell: bash
        run: 7z a "Taskloom-proof-evidence-${GITHUB_REF_NAME//\//-}.zip" ./proof ./results > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: taskloom-proof-evidence, path: Taskloom-proof-evidence-*.zip}

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/build.py
      - name: Smoke test the packaged app
        shell: bash
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          uv run python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-windows, path: dist/*.zip}

  linux-runner:
    needs: test
    runs-on: ubuntu-latest
    # Built against glibc 2.28, so it runs on any Linux with glibc 2.28 or newer.
    container: almalinux:8
    steps:
      - run: dnf install -y python3.12 python3.12-devel binutils tar gzip java-17-openjdk-headless
      - uses: actions/checkout@v4
      - run: |
          python3.12 -m venv /venv
          /venv/bin/pip install --upgrade pip
          /venv/bin/pip install . "pyinstaller>=6.10"
      - run: /venv/bin/python packaging/build.py --headless
      - name: Smoke test the packaged runner
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          /venv/bin/python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-runner-linux, path: dist/*.tar.gz}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-runner, proof, proof-linux]  # nothing is released without its proof
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4  # the app, the runner and the proof PDF; not the Linux proof's records
        with: {path: artifacts, pattern: "taskloom-*", merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "artifacts/*"}

  # The documentation website on GitHub Pages, from each release tag. No job needs it, so it never holds up or fails
  # a release (it fails on its own until Settings > Pages > Source is GitHub Actions; see README, Development).
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/docs_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
