name: test and build

# Not on a push to main: a release's v* tag runs the whole pipeline on that same commit (each release ran it twice),
# and a branch is checked by its pull request or by a run by hand.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "Only these tests, on Windows and Linux, and nothing else (pytest arguments, for example
          tests/test_scheduler.py -k overlap). Empty: the whole run."
        default: ""
      features:
        description: "Only the mutation testing of these features, and nothing else (the names of their
          docs/promises/<name>.mutants.yaml, separated by commas or spaces, for example updates,braces or scheduler):
          each that has no kept result for its files runs, and keeps its result for later runs. Not with tests."
        default: ""
      fresh:
        description: "Run every long check again (the scheduler's model check and mutation testing, each feature's
          mutation testing) rather than take its result from an earlier run; its result is still kept for later runs."
        type: boolean
        default: false

env:
  QT_QPA_PLATFORM: offscreen
  PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
  H2_URL: https://repo1.maven.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar
  # TLC 1.7.4's tla2tools.jar, as checked after its download (the scheduler's model check and trace validation run it)
  TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  # The tests, on machines that run at once, each a share of the test files, whole (packaging/test_shards.py, by the
  # minutes each file took): 3 on Windows and 2 on Linux, about 35 minutes each instead of 1 h 30 and 1 h 15 on one.
  test:
    if: ${{ !inputs.features }}  # (run by hand with features: only their mutation testing)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: ${{ fromJSON(inputs.tests && '[1]' || '[1, 2, 3]') }}  # (run by hand with tests: one machine each)
        exclude:
          - {os: ubuntu-latest, shard: 3}
        include:  # how many machines share the OS's test files (the proof job expects as many results files)
          - {os: windows-latest, of: 3}
          - {os: ubuntu-latest, of: 2}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - run: uv run pyflakes taskloom tests packaging
      - name: Tests, this machine's test files (the proofs run in the proof jobs)
        shell: bash
        run: |
          if [ -n "$PYTEST_ADDOPTS" ]; then
            uv run pytest -q --ignore=tests/proofs
          else  # as arguments, not in PYTEST_ADDOPTS: a pytest run that a test starts would take them too
            files=$(uv run python packaging/test_shards.py --shard ${{ matrix.shard }}/${{ matrix.of }})
            uv run pytest -q --durations=0 $files  # (every test's time, for packaging/test_shards.py's table)
          fi
        env:  # which agreed row or charter rule each test checks, and how every test ended: for the proof's ledger
          TASKLOOM_LEDGER: ${{ github.workspace }}/results-${{ runner.os }}-${{ matrix.shard }}.json
          PYTEST_ADDOPTS: ${{ inputs.tests }}  # (run by hand with tests: only those; pytest splits them on both OSes)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a test failed: the ledger shows which row it breaks
        with:
          name: "test-results-${{ runner.os }}-${{ matrix.shard }}"
          path: "results-${{ runner.os }}-${{ matrix.shard }}.json"

  # The scheduler's model check (about 2 h), and each feature's mutation testing (the scheduler's in 3 parts of about
  # 1 h), are not run again when every file they read is byte for byte as in an earlier run of this repository whose
  # result is less than 30 days old: that result is used instead, and the proof PDF names its run. A check's key is a
  # hash of those files and of the tools' versions (packaging/ci_reuse.py key); a run whose check passed keeps its
  # result under that key (reuse-model-<key>, reuse-feature-<feature>-<key>, or each part of a feature in parts:
  # reuse-feature-<feature>-<key>-part-<k>). This job works out the keys and the newest run that has them (for a
  # feature in parts, every part from one run); run by hand with fresh, it looks for none, so every long check runs
  # (and keeps its result). Run by hand with features, it does so for those features' mutation testing only, and fails
  # at once for a name that is no feature, or when tests is given too.
  decide:
    if: ${{ !inputs.tests || inputs.features }}  # (with both: it fails at once)
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}  # (the default token cannot list artifacts or read runs)
    outputs:
      model_key: ${{ steps.find.outputs.model_key }}
      model_run: ${{ steps.find.outputs.model_run }}
      model_url: ${{ steps.find.outputs.model_url }}
      model_date: ${{ steps.find.outputs.model_date }}
      # Each feature not in parts whose result is taken from an earlier run: {"<feature>": {run, url, date, key}, ...}
      features_reused: ${{ steps.find.outputs.features_reused }}
      # Each feature in parts, for the score job: [{feature, of (its parts), key, and run, url, date when its parts are
      # taken from an earlier run}, ...]; and the parts the mutation job runs: [{feature, part, of, key}, ...]
      parted: ${{ steps.find.outputs.parted }}
      parts: ${{ steps.find.outputs.parts }}
    steps:
      - name: Run by hand with tests or with features, not both
        if: ${{ inputs.tests && inputs.features }}
        run: |
          echo "::error::Run by hand with tests or with features, not both: only one of them may be given"
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - id: find
        env: {GH_TOKEN: "${{ github.token }}", FRESH: "${{ inputs.fresh }}", FEATURES: "${{ inputs.features }}"}
        run: |
          # The newest run that has every artifact named, none expired, none 30 days old or more, all uploaded by this
          # repository's own branches, not by a fork's pull request (anyone can write what that uploads): ci_reuse.py
          # pick. A failed lookup finds nothing: it runs. Run by hand with fresh: no lookup.
          newest() {
            [ "$FRESH" != true ] || return 0
            for name in "$@"; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --jq '.artifacts[]' || true
            done | uv run python packaging/ci_reuse.py pick --repo-id "$GITHUB_REPOSITORY_ID" "$@" || true
          }
          # The features whose mutation testing runs, each with its parts and the check whose key keeps its result
          # (ci_reuse.py select): every one, or run by hand with features those named (a name that is none fails here).
          selected=$(uv run python packaging/ci_reuse.py select --features "$FEATURES")
          [ "$FRESH" != true ] || echo "Run by hand with fresh: every long check runs"
          # Besides the files: TLC (as downloaded in the model-check job), Java and Python (as the jobs set them up).
          # The checkers-features job passes the same.
          salt="tlc 1.7.4 $TLC_SHA256 java 17 python 3.12"
          if [ -z "$FEATURES" ]; then  # (run by hand with features, the model check does not run)
            key=$(uv run python packaging/ci_reuse.py key model --salt "$salt")
            echo "model_key=$key" >> "$GITHUB_OUTPUT"
            run=$(newest "reuse-model-$key")
            if [ -n "$run" ] && about=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                --jq '"run=\(.id)\nurl=\(.html_url)\ndate=\(.created_at[:10])"'); then
              echo "$about" | sed "s/^/model_/" >> "$GITHUB_OUTPUT"
              echo "model: reused from run $run, its files unchanged (key $key)"
            else
              echo "model: no earlier result of key $key; it runs"
            fi
          fi
          # Each feature's mutation testing (a feature without a key always runs, and its result is not kept). One not
          # in parts runs in the checkers-features job, which leaves out those taken from an earlier run; one in parts
          # (and the scheduler's, whose other checkers have jobs of their own) in the mutation job, those not taken
          # from an earlier run, and is scored in the score job.
          reused='{}' parted='[]' parts='[]'
          while read -r -u 3 feature of check; do
            about='{}'
            if ! key=$(uv run python packaging/ci_reuse.py key "$check" --salt "$salt"); then
              key=; echo "$feature: no key; it runs, and its result is not kept"
            else
              names="reuse-feature-$feature-$key"
              if [ "$of" != 1 ] || [ "$feature" = scheduler ]; then  # (all its parts from one run)
                names=$(for part in $(seq "$of"); do echo "$names-part-$part"; done)
              fi
              if run=$(newest $names) && [ -n "$run" ] && about=$(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                  --jq '{run: .id | tostring, url: .html_url, date: .created_at[:10]}'); then
                echo "$feature: reused from run $run, its files unchanged (key $key)"
              else
                about='{}'; echo "$feature: no earlier result of key $key; it runs"
              fi
            fi
            if [ "$of" = 1 ] && [ "$feature" != scheduler ]; then
              [ "$about" = '{}' ] || reused=$(jq -c --arg feature "$feature" --arg key "$key" --argjson about "$about" \
                '.[$feature] = $about + {key: $key}' <<< "$reused")
            else
              parted=$(jq -c --arg feature "$feature" --argjson of "$of" --arg key "$key" --argjson about "$about" \
                '. + [{feature: $feature, of: $of, key: $key} + $about]' <<< "$parted")
              [ "$about" != '{}' ] || parts=$(jq -c --arg feature "$feature" --argjson of "$of" --arg key "$key" \
                '. + [range(1; $of + 1) | {feature: $feature, part: ., of: $of, key: $key}]' <<< "$parts")
            fi
          done 3<<< "$selected"
          { echo "features_reused=$reused"; echo "parted=$parted"; echo "parts=$parts"; } >> "$GITHUB_OUTPUT"

  # The checkers of the scheduler feature (docs/promises/scheduler.evidence.yaml): each one's whole output and result
  # go to proof/, which the proof job turns into the feature's pages. A GitHub job runs at most 6 hours, so they run in
  # parallel jobs: the model check alone, in the model-check job (about 2 h 10 min; 1 h 24 min on a 10-core laptop
  # with 4 workers); the trace validation, the leak check and design health together, here (about 20 min); mutation
  # testing in 3 parts, in the mutation job (scored in the score job). The evidence job puts their results together.
  checkers:
    if: ${{ !inputs.tests && !inputs.features }}  # (run by hand with tests or features: only those run)
    runs-on: ubuntu-latest
    timeout-minutes: 330  # (packaging/checkers.py stops a checker after 5 hours, so its log is kept)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: TLA+ tools 1.7.4 (TLC, for the trace validation), where packaging/tla_trace.py looks
        env: {GH_TOKEN: "${{ github.token }}"}  # (signed in: an anonymous download can be refused)
        run: |
          jar="$HOME/.local/share/tlaplus/1.7.4/tla2tools.jar"
          mkdir -p "$(dirname "$jar")"
          for try in 1 2 3 4 5; do
            gh release download v1.7.4 -R tlaplus/tlaplus -p tla2tools.jar -O "$jar" --clobber && break
            echo "download $try failed; trying again in 20 s"; sleep 20
          done
          echo "$TLC_SHA256  $jar" | sha256sum -c -
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - run: >-
          uv run python packaging/checkers.py docs/promises/scheduler.yaml proof
          --only "TLA+ trace validation" --only "Leak check" --only "Design health"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a checker failed: the proof shows its output
        with:
          name: checkers-trace-leak-design
          path: |
            proof
            !proof/**/tlc-states

  # The scheduler's TLA+ model check, when no earlier run's result can be used (decide job).
  model-check:
    needs: decide
    # (also when decide failed in a whole run)
    if: ${{ !cancelled() && !inputs.tests && !inputs.features && !needs.decide.outputs.model_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 330  # (packaging/checkers.py stops a checker after 5 hours, so its log is kept)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: TLA+ tools 1.7.4 (TLC), where the model check's command looks
        env: {GH_TOKEN: "${{ github.token }}"}  # (signed in: an anonymous download can be refused)
        run: |
          jar="$HOME/.local/share/tlaplus/1.7.4/tla2tools.jar"
          mkdir -p "$(dirname "$jar")"
          for try in 1 2 3 4 5; do
            gh release download v1.7.4 -R tlaplus/tlaplus -p tla2tools.jar -O "$jar" --clobber && break
            echo "download $try failed; trying again in 20 s"; sleep 20
          done
          echo "$TLC_SHA256  $jar" | sha256sum -c -
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/checkers.py docs/promises/scheduler.yaml proof --only "TLA+ model check"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when it failed: the proof shows its output
        with:
          name: checkers-model
          path: |
            proof
            !proof/**/tlc-states
      - uses: actions/upload-artifact@v4
        if: needs.decide.outputs.model_key  # (only when it passed: a failed or cut-short result is never reused)
        with:
          name: reuse-model-${{ needs.decide.outputs.model_key }}
          path: |
            proof
            !proof/**/tlc-states

  # Mutation testing of each feature in parts (parts: N in its <feature>.mutants.yaml; the scheduler's in 3), the parts
  # at once, each a job that runs every Nth mutant that counts (packaging/mutants.py --part K/N; the scheduler's about
  # 2 h 15 min each, 3.8 h for all on a 10-core laptop with 4 workers), when no earlier run's result can be used
  # (decide job, which lists them). The score job scores each feature's parts as one run.
  mutation:
    needs: decide
    name: mutation (${{ matrix.feature }}, part ${{ matrix.part }} of ${{ matrix.of }})
    if: needs.decide.outputs.parts != '[]'  # (a matrix of none is an error)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.parts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - name: Mutation testing, this part (its whole output goes to proof/<feature>/logs)
        run: |
          set -o pipefail
          mkdir -p "proof/${{ matrix.feature }}/logs"
          uv run python packaging/mutants.py . --run --part ${{ matrix.part }}/${{ matrix.of }} \
            --explained "docs/promises/${{ matrix.feature }}.mutants.yaml" 2>&1 \
            | tee "proof/${{ matrix.feature }}/logs/mutation-part-${{ matrix.part }}.log" || status=1
          # A feature with a scope runs in build/mutation/<feature>: its records go to mutants/, as the scheduler's
          # (where the score job looks for each part's), also when the run failed.
          [ ! -d "build/mutation/${{ matrix.feature }}/mutants" ] || mv "build/mutation/${{ matrix.feature }}/mutants" .
          git rev-parse HEAD > tested-commit  # the commit tested (on a pull request, its merge commit), for a reuse
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when it failed: the score job says which mutants have no verdict
        with:
          name: mutation-${{ matrix.feature }}-part-${{ matrix.part }}
          path: |
            mutants
            proof
            !mutants/**/__pycache__
      - uses: actions/upload-artifact@v4
        if: matrix.key  # (only when it passed: a failed or cut-short part is never reused)
        with:
          name: reuse-feature-${{ matrix.feature }}-${{ matrix.key }}-part-${{ matrix.part }}
          path: |
            mutants
            proof
            tested-commit
            !mutants/**/__pycache__

  # The checkers of every other feature (docs/promises/<feature>.evidence.yaml), each feature's in a job of its own
  # (checkers-features, one for each name the features job lists), so that a job that dies (a feature's mutation
  # testing once took all its machine's memory) takes no other feature's results with it: a bug fix or small feature
  # lists only mutation testing of the functions it changed (the scope in its <feature>.mutants.yaml), a few minutes
  # each. Their output and results go to proof/<feature>/, as the scheduler's. A feature whose result is taken from an
  # earlier run (decide job) is not run again; one whose checkers passed keeps their result under its key. A feature
  # in parts runs in the mutation job instead.
  features:
    needs: decide
    # (also when decide failed in a whole run: then every feature's checkers run; run by hand with features, only
    # when decide passed: it fails for a name that is no feature)
    if: ${{ !cancelled() && !inputs.tests && (needs.decide.result == 'success' || !inputs.features) }}
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - id: list
        env: {FEATURES: "${{ inputs.features }}", REUSED: "${{ needs.decide.outputs.features_reused }}"}
        run: |
          # Each feature's checkers are mutation testing of the scope in its <feature>.mutants.yaml (ci_reuse.py
          # select: every feature, or run by hand with features those named). Those in parts, and the scheduler's,
          # run in the jobs above; those whose result is taken from an earlier run are left out.
          selected=$(uv run python packaging/ci_reuse.py select --features "$FEATURES")
          while read -r name of check; do
            [ "$of" = 1 ] && [ "$name" != scheduler ] || continue
            if [ -n "$REUSED" ] && jq -e --arg name "$name" 'has($name)' <<< "$REUSED" > /dev/null; then
              continue
            fi
            names="$names${names:+, }\"$name\""
          done <<< "$selected"
          echo "names=[$names]" >> "$GITHUB_OUTPUT"

  checkers-features:
    needs: features
    # (none when every feature's result is taken from an earlier run: a matrix of none is an error)
    if: >-
      ${{ !cancelled() && !inputs.tests && needs.features.result == 'success'
      && needs.features.outputs.names != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.features.outputs.names) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330  # (as the scheduler's: the one brace rule's mutation testing, 492 mutants, takes over 90 minutes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - name: Its key, as the decide job works it out (none when the key cannot cover its checkers)
        id: key
        run: >-
          echo "key=$(uv run python packaging/ci_reuse.py key "feature:${{ matrix.feature }}"
          --salt "tlc 1.7.4 $TLC_SHA256 java 17 python 3.12")" >> "$GITHUB_OUTPUT"
      - run: uv run python packaging/checkers.py "docs/promises/${{ matrix.feature }}.yaml" proof
      - uses: actions/upload-artifact@v4
        if: always()  # also when a checker failed or the job ran out of time: the proof shows its output so far
        with: {name: "checkers-feature-${{ matrix.feature }}", path: proof}
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.key  # (only when its checkers passed: a failed or cut-short result is never reused)
        with: {name: "reuse-feature-${{ matrix.feature }}-${{ steps.key.outputs.key }}", path: proof}

  # Each feature in parts (the decide job lists them), its parts scored as one run (packaging/mutants.py --parts), in a
  # job of its own: the parts this run's mutation job ran, or those an earlier run kept, whose record then says it is
  # that run's result, its date and the commit its parts tested (packaging/ci_reuse.py mark), as the PDF does. Its
  # result goes where a feature's checkers-features job puts it; it fails, as that does, below the bar.
  score:
    needs: [decide, mutation]
    name: score (${{ matrix.feature }})
    # (also when a part failed or ran out of time: the proof shows which mutants have no verdict)
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.parted != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.parted) }}
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}  # (the default token cannot download another run's artifacts)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - name: Its parts, from this run
        if: ${{ !matrix.run }}
        uses: actions/download-artifact@v4
        with: {pattern: "mutation-${{ matrix.feature }}-part-*", path: parts}
      - name: Its parts, from the earlier run
        if: ${{ matrix.run }}
        uses: actions/download-artifact@v4
        with:
          pattern: reuse-feature-${{ matrix.feature }}-${{ matrix.key }}-part-*
          path: parts
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}  # (without it, run-id is not used)
      - name: All its parts came, each with the commit it tested (a pattern that finds nothing does not fail)
        id: reused
        if: ${{ matrix.run }}
        run: |
          for part in $(seq ${{ matrix.of }}); do
            file="parts/reuse-feature-${{ matrix.feature }}-${{ matrix.key }}-part-$part/tested-commit"
            commit=$(cat "$file") && [ -n "$commit" ] || { echo "::error::Not downloaded: $file"; exit 1; }
          done
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Its parts scored as one run, in proof/<feature> with each part's log
        if: ${{ !cancelled() }}
        run: |
          mkdir -p proof
          for part in parts/*/proof; do [ ! -d "$part" ] || cp -r "$part/." proof/; done
          uv run python packaging/checkers.py "docs/promises/${{ matrix.feature }}.yaml" proof \
            --only "Mutation testing" \
            --command "python packaging/mutants.py . --parts parts/* --explained docs/promises/${{ matrix.feature }}.mutants.yaml --out {out}/mutants.json"
      - name: Its record says its verdicts are the earlier run's, of the commit its parts tested (scored here)
        if: ${{ !cancelled() && steps.reused.outcome == 'success' }}  # (a failed reuse shows as failed)
        run: >-
          uv run python packaging/ci_reuse.py mark proof --run "${{ matrix.run }}" --url "${{ matrix.url }}"
          --date "${{ matrix.date }}" --commit "${{ steps.reused.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when it failed: the proof shows its output
        with: {name: "checkers-feature-${{ matrix.feature }}", path: proof}

  # The checkers' results together, where the proof job reads them (proof-evidence: proof/<feature>/ with
  # checkers.json, every checker in its listed order, their logs, mutants.json and, for the scheduler, leak.json): every
  # job's results merged, feature by feature (packaging/checkers.py --merge). A result taken from an earlier run (decide
  # job) goes where this run's would, and its record names that run, its date and the commit it checked
  # (packaging/ci_reuse.py mark), as the PDF does (a feature in parts: by its score job).
  evidence:
    needs: [decide, checkers, model-check, checkers-features, score]
    # also when a checker failed or ran out of time: the proof shows which
    if: ${{ !cancelled() && !inputs.tests && !inputs.features }}
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}  # (the default token cannot download another run's artifacts)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - uses: actions/download-artifact@v4
        with: {pattern: "checkers-*", path: jobs}
      - name: Each feature's result taken from an earlier run, where this run's would be, its record saying so
        if: ${{ !cancelled() && needs.decide.outputs.features_reused }}
        env: {GH_TOKEN: "${{ github.token }}", REUSED: "${{ needs.decide.outputs.features_reused }}"}
        run: |
          # Its record was written in that run: it keeps the commit tested there (no --commit). One not downloaded
          # fails here.
          while read -r feature run date key url; do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "reuse-feature-$feature-$key" \
                -D "jobs/checkers-feature-$feature"; then
              uv run python packaging/ci_reuse.py mark "jobs/checkers-feature-$feature" --run "$run" --url "$url" \
                --date "$date" || status=1
            else
              echo "::error::Not downloaded: reuse-feature-$feature-$key of run $run"; status=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.run) \(.value.date) \(.value.key) \(.value.url)"' \
            <<< "$REUSED")
          exit ${status:-0}
      - name: The model check's result, from the earlier run
        if: ${{ !cancelled() && needs.decide.outputs.model_run }}
        uses: actions/download-artifact@v4
        with:
          name: reuse-model-${{ needs.decide.outputs.model_key }}
          path: jobs/checkers-model
          run-id: ${{ needs.decide.outputs.model_run }}
          github-token: ${{ github.token }}  # (without it, run-id is not used)
      - name: The model check's record says it is the earlier run's
        if: ${{ !cancelled() && needs.decide.outputs.model_run }}
        run: >-
          uv run python packaging/ci_reuse.py mark jobs/checkers-model --run "${{ needs.decide.outputs.model_run }}"
          --url "${{ needs.decide.outputs.model_url }}" --date "${{ needs.decide.outputs.model_date }}"
      - name: Every checker's result, in proof/
        if: ${{ !cancelled() }}
        run: |
          # A feature is its agreed list, <feature>.yaml; each job's folder holds the features whose checkers it ran.
          for promises in docs/promises/*.yaml; do
            case "$promises" in *.*.yaml) continue;; esac
            uv run python packaging/checkers.py "$promises" proof --merge jobs/* || status=1
          done
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-evidence, path: proof}

  # The proofs Windows cannot show (marked linux_proof, each saying why), on Linux: the proof job puts them in its PDF.
  proof-linux:
    if: ${{ !inputs.tests && !inputs.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries, and fonts for the screenshots (DejaVu, found through fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q -m linux_proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        with: {name: proof-records-linux, path: "${{ env.PROOF_DIR }}"}

  # The proof: each feature and fix shown working in the app, on Windows (or on Linux, by the proof-linux job, those
  # Windows cannot show), as one PDF of screenshots and checks.
  proof:
    needs: [proof-linux, test, evidence]
    # also when a Linux proof, a test or a checker failed: the PDF shows what failed
    if: ${{ !cancelled() && !inputs.tests && !inputs.features }}
    runs-on: windows-latest
    timeout-minutes: 45  # the proofs alone take about 28 minutes on Windows
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # the history and tags: the PDF says which changes are new since the last release
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-records-linux, path: proofs-linux}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {pattern: "test-results-*", path: shards, merge-multiple: true}
      - name: Each OS's test results in one file, as one machine running all its tests would have written it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # As many files as the test job has machines for the OS: one missing (its machine crashed or ran out of
          # time) fails here, rather than its tests silently dropping out of the ledger and the numbers.
          mkdir -p results
          uv run python packaging/merge_results.py --expect 3 results/results-Windows.json \
            shards/results-Windows-*.json || status=1
          uv run python packaging/merge_results.py --expect 2 results/results-Linux.json \
            shards/results-Linux-*.json || status=1
          exit ${status:-0}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-evidence, path: proof}
      - name: Evidence ledger, C4 view and release-wide numbers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # A feature is its agreed list, <feature>.yaml; its other files are <feature>.<kind>.yaml.
          for promises in docs/promises/*.yaml; do
            case "$promises" in *.*.yaml) continue;; esac
            stem=$(basename "$promises" .yaml)
            mkdir -p "proof/$stem"
            uv run python packaging/ledger.py "$promises" results/*.json --checkers "proof/$stem/checkers.json" \
              --out "proof/$stem/ledger.json" || status=1
          done
          uv run python packaging/c4.py proof/c4
          uv run python packaging/release_evidence.py proof results/*.json
          exit ${status:-0}
      - name: Proof PDF
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        shell: bash
        run: |
          features=(); for promises in docs/promises/*.yaml; do
            case "$promises" in *.*.yaml) continue;; esac
            features+=(--feature "$promises")
          done
          uv run python packaging/proof_pdf.py "$PROOF_DIR" proofs-linux "Taskloom-proof-${GITHUB_REF_NAME//\//-}.pdf" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${features[@]}" --evidence proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: taskloom-proof, path: Taskloom-proof-*.pdf}
      - name: The evidence behind the PDF (each checker's whole log), for the release
        if: ${{ !cancelled() }}
        shell: bash
        run: 7z a "Taskloom-proof-evidence-${GITHUB_REF_NAME//\//-}.zip" ./proof ./results > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: taskloom-proof-evidence, path: Taskloom-proof-evidence-*.zip}

  windows:
    needs: test
    if: ${{ !inputs.tests }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/build.py
      - name: Smoke test the packaged app
        shell: bash
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          uv run python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-windows, path: dist/*.zip}

  linux-runner:
    needs: test
    if: ${{ !inputs.tests }}
    runs-on: ubuntu-latest
    # Built against glibc 2.28, so it runs on any Linux with glibc 2.28 or newer.
    container: almalinux:8
    steps:
      - run: dnf install -y python3.12 python3.12-devel binutils tar gzip java-17-openjdk-headless
      - uses: actions/checkout@v4
      - run: |
          python3.12 -m venv /venv
          /venv/bin/pip install --upgrade pip
          /venv/bin/pip install . "pyinstaller>=6.10"
      - run: /venv/bin/python packaging/build.py --headless
      - name: Smoke test the packaged runner
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          /venv/bin/python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-runner-linux, path: dist/*.tar.gz}

  release:
    # (A long check taken from an earlier run skips its job; without !cancelled() GitHub would skip this job too,
    # however far up that one is: so it says itself that each job it needs must have succeeded.)
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
      && needs.linux-runner.result == 'success' && needs.proof.result == 'success'
      && needs.proof-linux.result == 'success' }}
    needs: [windows, linux-runner, proof, proof-linux]  # nothing is released without its proof
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4  # the app, the runner and the proof PDF; not the Linux proof's records
        with: {path: artifacts, pattern: "taskloom-*", merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "artifacts/*"}

  # The documentation website on GitHub Pages, from each release tag. No job needs it, so it never holds up or fails
  # a release (it fails on its own until Settings > Pages > Source is GitHub Actions; see docs/guide.md, Development).
  pages:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' }}  # (as release)
    needs: release
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/docs_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
