name: test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
  H2_URL: https://repo1.maven.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.12
      - run: uv run pyflakes taskloom tests packaging
      - run: uv run pytest -q --ignore=tests/proofs  # the proofs run in the proof jobs

  # The proofs Windows cannot show (marked linux_proof, each saying why), on Linux: the proof job puts them in its PDF.
  proof-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - name: Qt libraries, and fonts for the screenshots (DejaVu, found through fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q -m linux_proof
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        with: {name: proof-records-linux, path: "${{ env.PROOF_DIR }}"}

  # The proof: each feature and fix shown working in the app, on Windows (or on Linux, by the proof-linux job, those
  # Windows cannot show), as one PDF of screenshots and checks.
  proof:
    needs: proof-linux
    if: ${{ !cancelled() }}  # also when a Linux proof failed: the PDF shows what failed
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PROOF_DIR: ${{ github.workspace }}/proofs
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # the history and tags: the PDF says which changes are new since the last release
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest tests/proofs -q
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: proof-records-linux, path: proofs-linux}
      - name: Proof PDF
        if: ${{ !cancelled() }}  # also when a proof failed: the PDF shows what failed
        shell: bash
        run: |
          uv run python packaging/proof_pdf.py "$PROOF_DIR" proofs-linux "Taskloom-proof-${GITHUB_REF_NAME//\//-}.pdf" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: taskloom-proof, path: Taskloom-proof-*.pdf}

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/build.py
      - name: Smoke test the packaged app
        shell: bash
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          uv run python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-windows, path: dist/*.zip}

  linux-runner:
    needs: test
    runs-on: ubuntu-latest
    # Built against glibc 2.28, so it runs on any Linux with glibc 2.28 or newer.
    container: almalinux:8
    steps:
      - run: dnf install -y python3.12 python3.12-devel binutils tar gzip java-17-openjdk-headless
      - uses: actions/checkout@v4
      - run: |
          python3.12 -m venv /venv
          /venv/bin/pip install --upgrade pip
          /venv/bin/pip install . "pyinstaller>=6.10"
      - run: /venv/bin/python packaging/build.py --headless
      - name: Smoke test the packaged runner
        run: |
          curl -sfL "$H2_URL" -o h2.jar
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          /venv/bin/python packaging/smoke.py dist/taskloom --h2-jar h2.jar
      - uses: actions/upload-artifact@v4
        with: {name: taskloom-runner-linux, path: dist/*.tar.gz}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-runner, proof, proof-linux]  # nothing is released without its proof
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4  # the app, the runner and the proof PDF; not the Linux proof's records
        with: {path: artifacts, pattern: "taskloom-*", merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "artifacts/*"}

  # The documentation website on GitHub Pages, from each release tag. No job needs it, so it never holds up or fails
  # a release (it fails on its own until Settings > Pages > Source is GitHub Actions; see README, Development).
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python packaging/docs_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
